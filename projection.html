<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IASD APP · Tela de projeção</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
body{display:grid;place-items:center;font-family:Inter,system-ui,Arial,sans-serif}
#out{width:100%;height:100%;display:grid;place-items:center;padding:4vw;text-align:center;font-size:clamp(28px,4.8vw,88px);line-height:1.25;white-space:pre-wrap;overflow-wrap:anywhere}
#out img,#out video{display:block;max-width:100%;max-height:100%;object-fit:contain}


/* Projection typography — clean, responsive, legible from a distance */
body{background:#080e19}
#out{padding:5vw 7vw;white-space:normal;overflow:hidden}
#out.bible-mode{padding:5vh 8vw}
.bible-slide{width:min(100%,1500px);max-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(15px,3vh,40px);margin:auto;overflow:hidden}
.bible-slide:before{content:'';display:block;width:clamp(42px,5vw,76px);height:3px;background:linear-gradient(90deg,#b18a4e,#f5dba0,#b18a4e);border-radius:9px;flex:none}
.bible-slide .bible-text{margin:0;max-width:1250px;color:#f7f8fb;font-size:clamp(27px,3.65vw,72px);font-weight:560;letter-spacing:-.025em;line-height:1.35;text-wrap:balance;overflow-wrap:break-word}
.bible-slide .bible-reference{color:#e9c990;font-size:clamp(18px,1.8vw,32px);font-weight:700;letter-spacing:.065em;line-height:1.25}
.bible-slide .bible-version{color:#8c9cae;font-size:clamp(11px,.95vw,17px);font-weight:600;letter-spacing:.18em;text-transform:uppercase}
@media(max-width:700px){.bible-slide .bible-text{font-size:clamp(25px,4.5vw,48px)}#out.bible-mode{padding:5vh 5vw}}
#out{--c1:#c9a24a;--c2:#f5e3a6;--tx:#fff;--glow:rgba(214,170,80,.4);--ta:rgba(255,255,255,.1);--tb:rgba(0,0,0,.24);--tbg:rgba(8,12,30,.74);--tsh:rgba(0,0,0,.55);--d1:#fffbe6;--d2:var(--c2);--d3:var(--c1)}
#out.draw-mode{display:flex;flex-direction:column;gap:4.5vh;justify-content:center;align-items:center;position:relative}
.draw-label{display:flex;align-items:center;gap:1.6vw;font-size:clamp(20px,2.5vw,46px);color:var(--c2);font-weight:800;letter-spacing:.38em;text-indent:.38em;text-shadow:0 0 .6em var(--glow);position:relative;z-index:2}
.draw-label:before,.draw-label:after{content:'';width:clamp(40px,8vw,150px);height:2px;background:linear-gradient(90deg,transparent,var(--c1));border-radius:2px}.draw-label:after{transform:scaleX(-1)}
.draw-number{display:flex;gap:clamp(10px,1.7vw,30px);justify-content:center;align-items:center;font-size:clamp(100px,21vw,320px);line-height:1;position:relative;z-index:2}
.draw-tile{position:relative;display:grid;place-items:center;min-width:.66em;padding:.07em .09em .09em;border-radius:.13em;font-weight:900;font-variant-numeric:tabular-nums;color:var(--tx);
 background:linear-gradient(180deg,var(--ta) 0,var(--ta) 52%,var(--tb) 52%,var(--tb) 100%),var(--tbg);
 border:.014em solid color-mix(in srgb,var(--c1) 70%,transparent);
 box-shadow:inset 0 .012em 0 rgba(255,255,255,.4),0 .06em .22em var(--tsh),0 0 .55em var(--glow);text-shadow:0 .02em .06em rgba(0,0,0,.4)}
.draw-tile i{font-style:normal}
.draw-tile:after{content:'';position:absolute;left:0;right:0;top:52%;height:max(2px,.008em);background:rgba(0,0,0,.45);box-shadow:0 1px 0 rgba(255,255,255,.12)}
.draw-rolling .draw-tile{animation:tileJit .14s linear infinite}.draw-rolling .draw-tile:nth-child(2n){animation-delay:-.07s}
@keyframes tileJit{0%,100%{transform:translateY(0)}50%{transform:translateY(-.018em)}}
.draw-winner .draw-tile{border-color:var(--c2);animation:tilePop .75s cubic-bezier(.2,1.5,.4,1) both,tileGlow 2.4s ease-in-out .8s infinite}
.draw-winner .draw-tile i{background:linear-gradient(180deg,var(--d1) 8%,var(--d2) 46%,var(--d3) 92%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 .08em var(--glow))}
.draw-winner .draw-tile:nth-child(2){animation-delay:.09s,.9s}.draw-winner .draw-tile:nth-child(3){animation-delay:.18s,1s}.draw-winner .draw-tile:nth-child(4){animation-delay:.27s,1.1s}.draw-winner .draw-tile:nth-child(5){animation-delay:.36s,1.2s}
@keyframes tilePop{0%{transform:scale(.4) rotate(-6deg);opacity:0}60%{transform:scale(1.14) rotate(1.5deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes tileGlow{0%,100%{box-shadow:inset 0 .012em 0 rgba(255,255,255,.4),0 .06em .22em var(--tsh),0 0 .5em var(--glow)}50%{box-shadow:inset 0 .012em 0 rgba(255,255,255,.4),0 .06em .22em var(--tsh),0 0 1.05em var(--c1)}}
.draw-standby .draw-tile{animation:standbyPulse 1.9s ease-in-out infinite}.draw-standby .draw-tile i{color:var(--c2);text-shadow:0 0 .3em var(--glow)}
@keyframes standbyPulse{0%,100%{transform:scale(.94);opacity:.72}50%{transform:scale(1.03);opacity:1}}
.fireworks{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}.fireworks canvas{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity 1s}
#out.youtube-mode{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;margin:0!important;padding:0!important;display:block!important;overflow:hidden!important;background:#000!important}
#out.youtube-mode iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}\n
#out.local-media-mode{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;padding:0!important;margin:0!important;background:#000!important;display:flex!important;align-items:center!important;justify-content:center!important;overflow:hidden!important}#out.local-media-mode video{display:block!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;margin:0!important;object-fit:contain!important;background:#000!important}#out.local-media-mode audio{width:min(90%,650px)}
#out.timer-mode{padding:0;display:block;overflow:hidden;position:relative}

<script>
const out=document.getElementById('out');

window.addEventListener('load',()=>{

  document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
 }
});
function celebrateDraw(serial){

 const cs=getComputedStyle(out),c1=(cs.getPropertyValue('--c1')||'#c9a24a').trim(),c2=(cs.getPropertyValue('--c2')||'#f5e3a6').trim();

 const palettes=light?[[c1,c2],['#d6336c','#f59f00'],['#1c7ed6','#7048e8'],['#2f9e44','#fab005'],['#e8590c','#c2255c'],[c1,'#d6336c']]:[[c2,'#ffffff'],[c1,c2],['#ff6b6b','#ffd76b'],['#5cc8f5','#d6c8ff'],['#34d399','#b7f5db'],['#f89bd5','#ffd6ef'],['#ffd76b','#ff8c5b'],['#ffffff',c2]];
 const k=Math.min(W,H)/900,rnd=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2;
 const rockets=[],parts=[],flashes=[];let t0=performance.now(),last=t0,nextLaunch=0,launched=0;
 function launch(x,opts){rockets.push({x:x*W,y:H+10,vx:rnd(-.6,.6)*k,vy:-rnd(13.5,17)*k,ty:H*rnd(.14,.42),pal:palettes[(Math.random()*palettes.length)|0],type:(opts&&opts.type)||['peony','ring','willow','palm','peony','crackle'][(Math.random()*6)|0],big:opts&&opts.big,trail:[]})}
 function burst(r){
  const n=r.big?170:120,ca=r.pal[0],cb=r.pal[1],spd=(r.big?9.5:7.5)*k;flashes.push({x:r.x,y:r.y,life:1,c:ca,r:(r.big?330:220)*k});
  for(let i=0;i<n;i++){
   let a=TAU*i/n+rnd(-.03,.03),v=spd*(r.type==='ring'?1:rnd(.25,1)),life=rnd(70,110),g=.045*k,drag=.982,col=i%3?ca:cb,sz=rnd(1.6,3.1)*k*dpr;
   if(r.type==='willow'){v*=.62;life=rnd(120,170);g=.032*k;col=i%4?c1:c2;drag=.988}
   if(r.type==='palm'){const arm=i%8;a=TAU*arm/8+rnd(-.09,.09);v=spd*rnd(.5,1.05);life=rnd(90,130);g=.05*k}
   parts.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:life,max:life,g:g,drag:drag,c:col,s:sz,tw:Math.random()<.35,crk:r.type==='crackle'&&Math.random()<.22})

 }
 function frame(now){
  if(serial!==drawSerial||!layer.isConnected)return;
  const dt=Math.min(2.2,(now-last)/16.67);last=now;const el=now-t0;
  if(el<6200&&now>=nextLaunch){launched++;launch(launched===1?.5:rnd(.12,.88),{big:launched===1||launched%5===0,type:launched===1?'peony':undefined});if(launched<3)launch(rnd(.2,.8));nextLaunch=now+rnd(260,520)}
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,'+Math.min(.5,.2*dt)+')';ctx.fillRect(0,0,cv.width,cv.height);

  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.x+=r.vx*dt;r.y+=r.vy*dt;r.vy+=.16*k*dt;r.trail.push([r.x,r.y]);if(r.trail.length>9)r.trail.shift();
   ctx.globalAlpha=.9;ctx.strokeStyle=r.pal[1];ctx.lineWidth=2.4*k;ctx.lineCap='round';ctx.beginPath();r.trail.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
   if(r.y<=r.ty||r.vy>-1.2*k){burst(r);rockets.splice(i,1)}}

   if(p.life<=0){if(p.crk){for(let j=0;j<6;j++){const a=rnd(0,TAU),v=rnd(.8,2.6)*k;parts.push({x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(14,26),max:26,g:.02*k,drag:.96,c:'#fff',s:p.s*.6,tw:false,crk:false})}}parts.splice(i,1);continue}
   const f=p.life/p.max;ctx.globalAlpha=(p.tw&&((now/60+i)|0)%2?.35:1)*Math.min(1,f*1.6);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.4,p.s/dpr*(.55+.45*f)),0,TAU);ctx.fill()}

 }
 requestAnimationFrame(frame);
}
function drawDigits(text){const box=document.createElement('div');box.className='draw-number';drawSet(box,text);return box}
function drawSet(box,text){const s=String(text);while(box.children.length<s.length){const t=document.createElement('span');t.className='draw-tile';t.append(document.createElement('i'));box.append(t)}while(box.children.length>s.length)box.lastChild.remove();[...s].forEach((ch,j)=>{box.children[j].firstChild.textContent=ch});box.setAttribute('aria-label',s)}

function paintTheme(id){const th=window.IASDTimerDisplay&&IASDTimerDisplay.themes[id];if(!th)return null;out.style.background=th.bg;out.style.setProperty('--c1',th.c1);out.style.setProperty('--c2',th.c2);out.style.setProperty('--glow',th.glow);out.style.setProperty('--tx',th.tx||'#ffffff');const L=!!th.tx;[['--ta',L?'rgba(255,255,255,.8)':'rgba(255,255,255,.1)'],['--tb',L?'rgba(255,255,255,.42)':'rgba(0,0,0,.24)'],['--tbg',L?'rgba(255,255,255,.3)':'rgba(8,12,30,.74)'],['--tsh',L?'rgba(40,30,80,.28)':'rgba(0,0,0,.55)'],['--d1',L?th.c2:'#fffbe6'],['--d2',L?th.c1:th.c2],['--d3',L?th.tx:th.c1]].forEach(a=>out.style.setProperty(a[0],a[1]));return th}
const allowed='https://gtsaaixuampeaivugxdm.supabase.co/storage/v1/object/public/iasd-images/';
let gameLast=null,gameFrame=null;
function gameShow(t){
 let m;try{m=JSON.parse(t.slice('IASD_GAME:'.length))}catch(e){return}
 if(m.t==='snap'||m.t==='end')gameLast=m.t==='end'?null:m;
 if(!gameFrame||!gameFrame.isConnected){
  ++drawSerial;if(timerView){timerView.stop();timerView=null}out.replaceChildren();out.removeAttribute('class');out.style.background='#10062a';
  out.classList.add('game-mode');
  gameFrame=document.createElement('iframe');gameFrame.src='/jogos?telao=1&embed=1';gameFrame.setAttribute('allow','autoplay;fullscreen');
  gameFrame.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:#10062a';out.append(gameFrame);
 }
 try{gameFrame.contentWindow&&gameFrame.contentWindow.postMessage(m,location.origin)}catch(e){}
}
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.t==='lg-hello'&&gameFrame&&e.source===gameFrame.contentWindow&&gameLast)try{gameFrame.contentWindow.postMessage(gameLast,location.origin)}catch(_){}});
function show(value){
 const t=typeof value==='string'?value:'';
 if(t.startsWith('IASD_GAME:'))return gameShow(t);

 ++drawSerial;out.style.background='';['--c1','--c2','--glow','--tx','--ta','--tb','--tbg','--tsh','--d1','--d2','--d3'].forEach(v=>out.style.removeProperty(v));if(timerView){timerView.stop();timerView=null}out.replaceChildren();out.classList.remove('draw-mode','youtube-mode','local-media-mode','bible-mode','timer-mode');

 }else if(t.startsWith('IASD_BIBLE:')){

   const data=JSON.parse(t.slice('IASD_BIBLE:'.length));

   out.classList.add('bible-mode');
   const slide=document.createElement('article');slide.className='bible-slide';
   const quote=document.createElement('p');quote.className='bible-text';quote.textContent=data.text.replace(/\\n/g,' ').replace(/\s+/g,' ').trim();
   const reference=document.createElement('div');reference.className='bible-reference';reference.textContent=data.ref;
   const version=document.createElement('div');version.className='bible-version';version.textContent='João Ferreira de Almeida';
   const th=paintTheme(data.theme);if(th){reference.style.color=th.c2;if(th.tx){quote.style.color=th.tx;version.style.color=th.c1}}

   const fit=()=>{let size=parseFloat(getComputedStyle(quote).fontSize);while(slide.scrollHeight>out.clientHeight-30&&size>19){size-=2;quote.style.fontSize=size+'px'}};

  }catch(e){out.textContent='Não foi possível exibir a passagem.'}
 }else if(t.startsWith('IASD_DRAW_READY:')){
  try{
   const d=JSON.parse(t.slice('IASD_DRAW_READY:'.length));
   if(!Number.isSafeInteger(d.min)||!Number.isSafeInteger(d.max)||d.max<d.min||d.max-d.min>1000000)throw Error('Invalid range');

  }catch(e){out.textContent='Não foi possível preparar o sorteio.'}
 }else if(t.startsWith('IASD_DRAW_ANIM:')){

   frame.title='Vídeo do YouTube';frame.allow='autoplay;encrypted-media;picture-in-picture;fullscreen';
   frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';

  }catch(e){out.textContent='Não foi possível preparar o vídeo do YouTube.'}
 }else if(t.startsWith('IASD_LOCAL_MEDIA:')){
  try{
   const media=JSON.parse(t.slice('IASD_LOCAL_MEDIA:'.length));
   if(!['audio','video'].includes(media.kind)||typeof media.url!=='string'||!(media.url.startsWith('blob:'+location.origin+'/')||/^http:\/\/127\.0\.0\.1:38741\/media\/[a-f0-9]{32}$/.test(media.url)||/^https:\/\/gtsaaixuampeaivugxdm\.supabase\.co\/storage\/v1\/object\/public\/iasd-offering-videos\/[a-zA-Z0-9_./%-]+$/.test(media.url)))throw Error('Arquivo inválido');
   out.classList.add('local-media-mode');const el=document.createElement(media.kind);el.src=media.url;el.controls=!isPreview;el.autoplay=!isPreview;el.muted=isPreview;el.volume=isPreview?0:Math.max(0,Math.min(1,Number(media.volume??.75)));if(media.kind==='video'){el.setAttribute('playsinline','');el.style.cssText='position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;margin:0!important;padding:0!important;object-fit:contain!important;background:#000!important;z-index:9999!important;'}out.append(el);
   if(!isPreview)el.play().catch(()=>{const msg=document.createElement('p');msg.textContent='Clique no botão de reprodução para iniciar a mídia.';msg.style.fontSize='20px';out.append(msg)});
  }catch(e){out.textContent='Não foi possível carregar esta mídia. Abra o telão neste navegador e tente novamente.'}
 }else if(t.startsWith('IASD_IMAGE:')){
  const url=t.slice(11);
  if(url.startsWith(allowed)){const img=document.createElement('img');img.src=url;img.alt='Imagem projetada';out.append(img)}
  else out.textContent='Imagem indisponível';
 }else if(/^IASD_(?!TEXT:)[A-Z_]+:/.test(t)){out.textContent=''}
 else out.textContent=t.replace(/\\n/g,'\n');
}
const channel=typeof BroadcastChannel==='function'?new BroadcastChannel('iasd-stage'):null;
if(channel){channel.onmessage=e=>show(e.data);channel.postMessage({type:'projection-ready'})}
window.addEventListener('storage',e=>{if(e.key==='iasd-stage')show(e.newValue)});
async function setProjectionFullscreen(enable){
 if(isPreview)return;
 try{
  if(enable&&!document.fullscreenElement)await document.documentElement.requestFullscreen({navigationUI:'hide'});
  if(!enable&&document.fullscreenElement)await document.exitFullscreen();
  window.opener?.postMessage({type:'projection-fullscreen-result',active:!!document.fullscreenElement},location.origin);
 }catch(e){
  window.opener?.postMessage({type:'projection-fullscreen-result',active:!!document.fullscreenElement,blocked:true},location.origin);
 }
}
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||!e.data)return;
 if(e.data.type==='iasd-project')show(e.data.content);
 if(e.data.type==='iasd-fullscreen')void setProjectionFullscreen(!!e.data.enable);
 if(e.data.type==='iasd-studio-volume'){
  const v=Math.max(0,Math.min(1,Number(e.data.value)||0));
  out.querySelectorAll('audio,video').forEach(el=>el.volume=v);
 }
});
show(localStorage.getItem('iasd-stage')||'');
if(window.opener)try{window.opener.postMessage({type:'projection-ready'},location.origin)}catch(e){}
</script></body></html>
