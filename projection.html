<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IASD APP · Tela de projeção</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
body{display:grid;place-items:center;font-family:Inter,system-ui,Arial,sans-serif}
#out{width:100%;height:100%;display:grid;place-items:center;padding:4vw;text-align:center;font-size:clamp(28px,4.8vw,88px);line-height:1.25;white-space:pre-wrap;overflow-wrap:anywhere}
#out img,#out video{display:block;max-width:100%;max-height:100%;object-fit:contain}


/* Projection typography — clean, responsive, legible from a distance */
body{background:radial-gradient(ellipse at 50% 35%,#13263a 0%,#080e19 56%,#02050a 100%)}
#out{padding:5vw 7vw;white-space:normal;overflow:hidden}
#out.bible-mode{padding:5vh 8vw}
.bible-slide{width:min(100%,1500px);max-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(15px,3vh,40px);margin:auto;overflow:hidden}
.bible-slide:before{content:'';display:block;width:clamp(42px,5vw,76px);height:3px;background:linear-gradient(90deg,#b18a4e,#f5dba0,#b18a4e);border-radius:9px;flex:none}
.bible-slide .bible-text{margin:0;max-width:1250px;color:#f7f8fb;font-size:clamp(27px,3.65vw,72px);font-weight:560;letter-spacing:-.025em;line-height:1.35;text-wrap:balance;overflow-wrap:break-word}
.bible-slide .bible-reference{color:#e9c990;font-size:clamp(18px,1.8vw,32px);font-weight:700;letter-spacing:.065em;line-height:1.25}
.bible-slide .bible-version{color:#8c9cae;font-size:clamp(11px,.95vw,17px);font-weight:600;letter-spacing:.18em;text-transform:uppercase}
@media(max-width:700px){.bible-slide .bible-text{font-size:clamp(25px,4.5vw,48px)}#out.bible-mode{padding:5vh 5vw}}
</style></head><body><main id="out" aria-live="polite"></main>
<script>
const out=document.getElementById('out');
// Keep the audience display free of on-screen controls.
// Fullscreen may be denied without a user gesture; never display a fallback button.
window.addEventListener('load',()=>{
 if(!document.fullscreenElement&&document.documentElement.requestFullscreen){
  document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
 }
});
const allowed='https://gtsaaixuampeaivugxdm.supabase.co/storage/v1/object/public/iasd-images/';
function show(value){
 const t=typeof value==='string'?value:'';
 out.replaceChildren();
 out.classList.remove('bible-mode');
 if(t.startsWith('IASD_BIBLE:')){
  try{
   const data=JSON.parse(t.slice('IASD_BIBLE:'.length));
   if(typeof data.ref!=='string'||typeof data.text!=='string'||data.ref.length>100||data.text.length>12000)throw Error('Invalid Bible content');
   out.classList.add('bible-mode');
   const slide=document.createElement('article');slide.className='bible-slide';
   const quote=document.createElement('p');quote.className='bible-text';quote.textContent=data.text.replace(/\\n/g,' ').replace(/\s+/g,' ').trim();
   const reference=document.createElement('div');reference.className='bible-reference';reference.textContent=data.ref;
   const version=document.createElement('div');version.className='bible-version';version.textContent='João Ferreira de Almeida';
   slide.append(quote,reference,version);out.append(slide);
   const fit=()=>{let size=parseFloat(getComputedStyle(quote).fontSize);while(slide.scrollHeight>out.clientHeight-30&&size>19){size-=2;quote.style.fontSize=size+'px'}};
   requestAnimationFrame(fit);
  }catch(e){out.textContent='Não foi possível exibir a passagem.'}
 }else if(t.startsWith('IASD_IMAGE:')){
  const url=t.slice(11);
  if(url.startsWith(allowed)){const img=document.createElement('img');img.src=url;img.alt='Imagem projetada';out.append(img)}
  else out.textContent='Imagem indisponível';
 }else out.textContent=t.replace(/\\n/g,'\n');
}
const channel=typeof BroadcastChannel==='function'?new BroadcastChannel('iasd-stage'):null;
if(channel){channel.onmessage=e=>show(e.data);channel.postMessage({type:'projection-ready'})}
window.addEventListener('storage',e=>{if(e.key==='iasd-stage')show(e.newValue)});
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.type==='iasd-project')show(e.data.content)});
show(localStorage.getItem('iasd-stage')||'');
if(window.opener)try{window.opener.postMessage({type:'projection-ready'},location.origin)}catch(e){}
</script></body></html>
