<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IASD APP · Tela de projeção</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
body{display:grid;place-items:center;font-family:Inter,system-ui,Arial,sans-serif}
#out{width:100%;height:100%;display:grid;place-items:center;padding:4vw;text-align:center;font-size:clamp(28px,4.8vw,88px);line-height:1.25;white-space:pre-wrap;overflow-wrap:anywhere}
#out img,#out video{display:block;max-width:100%;max-height:100%;object-fit:contain}


/* Projection typography — clean, responsive, legible from a distance */
body{background:var(--projection-bg,#080e19)}
#out{padding:5vw 7vw;white-space:normal;overflow:hidden}
#out.bible-mode{padding:5vh 8vw}
.bible-slide{width:min(100%,1500px);max-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(15px,3vh,40px);margin:auto;overflow:hidden}
.bible-slide:before{content:'';display:block;width:clamp(42px,5vw,76px);height:3px;background:linear-gradient(90deg,#b18a4e,#f5dba0,#b18a4e);border-radius:9px;flex:none}
.bible-slide .bible-text{margin:0;max-width:1250px;color:#f7f8fb;font-size:clamp(27px,3.65vw,72px);font-weight:560;letter-spacing:-.025em;line-height:1.35;text-wrap:balance;overflow-wrap:break-word}
.bible-slide .bible-reference{color:#e9c990;font-size:clamp(18px,1.8vw,32px);font-weight:700;letter-spacing:.065em;line-height:1.25}
.bible-slide .bible-version{color:#8c9cae;font-size:clamp(11px,.95vw,17px);font-weight:600;letter-spacing:.18em;text-transform:uppercase}
@media(max-width:700px){.bible-slide .bible-text{font-size:clamp(25px,4.5vw,48px)}#out.bible-mode{padding:5vh 5vw}}
#out.draw-mode{display:flex;flex-direction:column;gap:5vh;justify-content:center}.draw-label{font-size:clamp(24px,3vw,55px);color:#f2d7a3;font-weight:800;letter-spacing:.1em}.draw-number{font-size:clamp(110px,22vw,330px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;color:#fff;text-shadow:0 0 65px #5279a8}.draw-winner{color:#f4cc75;animation:drawPop .6s ease-out;position:relative;z-index:2}.draw-standby{color:#f4cc75;animation:standbyPulse 1.65s ease-in-out infinite;text-shadow:0 0 35px #e6b65c,0 0 90px #a37a2c}@keyframes standbyPulse{0%,100%{transform:scale(.88);opacity:.65;text-shadow:0 0 20px #e6b65c}50%{transform:scale(1.09);opacity:1;text-shadow:0 0 70px #f4cc75,0 0 150px #d49c43}}.fireworks{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}.firework-spark{position:absolute;left:var(--x);top:var(--y);width:clamp(3px,.45vw,8px);height:clamp(3px,.45vw,8px);border-radius:50%;background:var(--c);box-shadow:0 0 13px var(--c),0 0 27px var(--c);opacity:0;animation:fireworkBurst 1.35s ease-out var(--delay) both}@keyframes fireworkBurst{0%{opacity:0;transform:translate(0,0) scale(.3)}12%{opacity:1}65%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.25)}}@keyframes drawPop{0%{transform:scale(.75)}65%{transform:scale(1.15)}100%{transform:scale(1)}}\n#out.youtube-mode{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;margin:0!important;padding:0!important;display:block!important;overflow:hidden!important;background:#000!important}\n#out.youtube-mode iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}\n
#out.local-media-mode{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;padding:0!important;margin:0!important;background:#000!important;display:flex!important;align-items:center!important;justify-content:center!important;overflow:hidden!important}#out.local-media-mode video{display:block!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;margin:0!important;object-fit:contain!important;background:#000!important}#out.local-media-mode audio{width:min(90%,650px)}

#out.sabbath-timer-mode{position:fixed;inset:0;padding:0;background:#06111d;overflow:hidden;display:block;text-align:left}
.st-stage{--accent:#2c86cf;position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 34%),linear-gradient(135deg,#071625,#0a1c2d 50%,#06111c);transition:background 2.4s ease}
.st-stage:before,.st-stage:after{content:"";position:absolute;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);transition:border-color 2.4s ease;animation:stOrbit 16s linear infinite}.st-stage:before{width:72vw;height:72vw;max-width:1100px;max-height:1100px}.st-stage:after{width:48vw;height:48vw;max-width:760px;max-height:760px;animation-direction:reverse;animation-duration:12s}
.st-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 52%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 38%);transition:background 2.4s ease;animation:stBreath 4s ease-in-out infinite}
.st-card{position:relative;z-index:2;width:min(88vw,1280px);display:grid;place-items:center;gap:clamp(10px,2vh,26px);text-align:center}
.st-mark{display:grid;place-items:center;width:clamp(58px,6vw,96px);height:clamp(58px,6vw,96px);border:1px solid color-mix(in srgb,var(--accent) 60%,#fff 12%);border-radius:50%;color:#fff;font-size:clamp(28px,3vw,48px);font-weight:800;box-shadow:0 0 35px color-mix(in srgb,var(--accent) 35%,transparent);transition:border-color 2.4s ease,box-shadow 2.4s ease}
.st-kicker{font-size:clamp(14px,1.25vw,23px);font-weight:750;letter-spacing:.28em;color:#dbe9f5}.st-title{font-size:clamp(18px,1.65vw,30px);font-weight:600;letter-spacing:.08em;color:#9eb3c5}
.st-time{font-size:clamp(110px,19vw,300px);font-weight:850;line-height:.82;letter-spacing:-.075em;font-variant-numeric:tabular-nums;color:#f8fbff;text-shadow:0 0 45px color-mix(in srgb,var(--accent) 38%,transparent);transition:text-shadow 2.4s ease,transform .5s ease}
.st-track{width:min(62vw,900px);height:7px;border-radius:99px;background:#ffffff18;overflow:hidden}.st-fill{height:100%;width:100%;border-radius:inherit;background:var(--accent);box-shadow:0 0 22px var(--accent);transition:width 1s linear,background 2.4s ease,box-shadow 2.4s ease}
.st-caption{font-size:clamp(12px,1vw,18px);letter-spacing:.16em;color:#8299ad}.st-final .st-time{font-size:clamp(55px,6.2vw,108px);line-height:1.05;letter-spacing:-.03em;max-width:1100px;animation:stFinal 1.6s ease-in-out infinite}.st-final .st-track{opacity:0}
@keyframes stOrbit{to{transform:rotate(360deg)}}@keyframes stBreath{50%{opacity:.62}}@keyframes stFinal{50%{transform:scale(1.025)}}
@media(prefers-reduced-motion:reduce){.st-stage:before,.st-stage:after,.st-glow,.st-final .st-time{animation:none}}
</style></head><body><main id="out" aria-live="polite"></main>
<script>
const out=document.getElementById('out');
let drawSerial=0;let sabbathTimerSerial=0;
const isPreview=new URLSearchParams(location.search).get('preview')==='1';
// Keep the audience display free of on-screen controls.
// Fullscreen may be denied without a user gesture; never display a fallback button.
window.addEventListener('load',()=>{
 if(!isPreview&&!document.fullscreenElement&&document.documentElement.requestFullscreen){
  document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
 }
});
function celebrateDraw(serial){
 if(serial!==drawSerial)return;
 const layer=document.createElement('div');layer.className='fireworks';layer.setAttribute('aria-hidden','true');
 out.append(layer);
 const colors=['#ffd76b','#ff8c5b','#79cfff','#f89bd5','#a6f1a1','#ffffff'];
 for(let burst=0;burst<7;burst++){
  const x=18+(burst%4)*21+(Math.floor(burst/4)*8),y=23+(burst%3)*23;
  for(let i=0;i<24;i++){
   const angle=2*Math.PI*i/24,dist=55+(i%4)*20;
   const spark=document.createElement('i');spark.className='firework-spark';
   spark.style.setProperty('--x',x+'%');spark.style.setProperty('--y',y+'%');
   spark.style.setProperty('--dx',Math.cos(angle)*dist+'px');
   spark.style.setProperty('--dy',Math.sin(angle)*dist+'px');
   spark.style.setProperty('--c',colors[(burst+i)%colors.length]);
   spark.style.setProperty('--delay',(burst*.31)+'s');
   layer.append(spark);
  }
 }
 setTimeout(()=>{if(serial===drawSerial)layer.remove()},4600);
}
const allowed='https://gtsaaixuampeaivugxdm.supabase.co/storage/v1/object/public/iasd-images/';
function show(value){
 const t=typeof value==='string'?value:'';
 ++drawSerial;++sabbathTimerSerial;out.replaceChildren();out.classList.remove('draw-mode','youtube-mode','local-media-mode','bible-mode','sabbath-timer-mode');
 if(t.startsWith('IASD_BIBLE:')){
  try{
   const data=JSON.parse(t.slice('IASD_BIBLE:'.length));
   if(typeof data.ref!=='string'||typeof data.text!=='string'||data.ref.length>100||data.text.length>12000)throw Error('Invalid Bible content');
   out.classList.add('bible-mode');
   const slide=document.createElement('article');slide.className='bible-slide';
   const quote=document.createElement('p');quote.className='bible-text';quote.textContent=data.text.replace(/\\n/g,' ').replace(/\s+/g,' ').trim();
   const reference=document.createElement('div');reference.className='bible-reference';reference.textContent=data.ref;
   const version=document.createElement('div');version.className='bible-version';version.textContent='João Ferreira de Almeida';
   slide.append(quote,reference,version);out.append(slide);
   const fit=()=>{let size=parseFloat(getComputedStyle(quote).fontSize);while(slide.scrollHeight>out.clientHeight-30&&size>19){size-=2;quote.style.fontSize=size+'px'}};
   requestAnimationFrame(fit);
  }catch(e){out.textContent='Não foi possível exibir a passagem.'}
 }else if(t.startsWith('IASD_DRAW_READY:')){
  try{
   const d=JSON.parse(t.slice('IASD_DRAW_READY:'.length));
   if(!Number.isSafeInteger(d.min)||!Number.isSafeInteger(d.max)||d.max<d.min||d.max-d.min>1000000)throw Error('Invalid range');
   out.classList.add('draw-mode');
   const zero=document.createElement('div');zero.className='draw-number draw-standby';zero.textContent='0';out.append(zero);
  }catch(e){out.textContent='Não foi possível preparar o sorteio.'}
 }else if(t.startsWith('IASD_DRAW_ANIM:')){
  try{
   const d=JSON.parse(t.slice('IASD_DRAW_ANIM:'.length));
   if(!Number.isSafeInteger(d.min)||!Number.isSafeInteger(d.max)||d.max<d.min||d.max-d.min>1000000||!Number.isSafeInteger(d.target)||d.target<d.min||d.target>d.max||d.duration<1000||d.duration>15000)throw Error('Invalid draw');
   const serial=++drawSerial,start=performance.now();
   out.classList.add('draw-mode');
   const label=document.createElement('div');label.className='draw-label';label.textContent='SORTEANDO…';
   const num=document.createElement('div');num.className='draw-number';num.textContent=String(d.min);
   out.append(label,num);
   function roll(now){if(serial!==drawSerial)return;const elapsed=now-start;num.textContent=String(elapsed>=d.duration?d.target:d.min+Math.floor(Math.random()*(d.max-d.min+1)));if(elapsed<d.duration){setTimeout(()=>requestAnimationFrame(roll),45+Math.pow(elapsed/d.duration,3)*300)}else{label.textContent='NÚMERO SORTEADO';num.classList.add('draw-winner');celebrateDraw(serial)}}
   requestAnimationFrame(roll);
  }catch(e){out.textContent='Não foi possível iniciar o sorteio.'}
 }else if(t.startsWith('IASD_DRAW:')){
  const value=t.slice('IASD_DRAW:'.length);out.classList.add('draw-mode');const label=document.createElement('div');label.className='draw-label';label.textContent='NÚMERO SORTEADO';const num=document.createElement('div');num.className='draw-number draw-winner';num.textContent=value;out.append(label,num);celebrateDraw(drawSerial);
 }else if(t.startsWith('IASD_SABBATH_TIMER:')){
  try{
   const d=JSON.parse(t.slice('IASD_SABBATH_TIMER:'.length)),total=Math.max(1,Number(d.total)||3600),serial=sabbathTimerSerial;
   out.classList.add('sabbath-timer-mode');
   const stage=document.createElement('section');stage.className='st-stage';
   const glow=document.createElement('div');glow.className='st-glow';
   const card=document.createElement('div');card.className='st-card';
   const mark=document.createElement('div');mark.className='st-mark';mark.textContent='✦';
   const kicker=document.createElement('div');kicker.className='st-kicker';kicker.textContent='ESCOLA SABATINA';
   const title=document.createElement('div');title.className='st-title';title.textContent='LIÇÃO DA ESCOLA SABATINA';
   const time=document.createElement('div');time.className='st-time';
   const track=document.createElement('div');track.className='st-track';const fill=document.createElement('div');fill.className='st-fill';track.append(fill);
   const caption=document.createElement('div');caption.className='st-caption';caption.textContent='TEMPO RESTANTE';
   card.append(mark,kicker,title,time,track,caption);stage.append(glow,card);out.append(stage);
   const hex=(a,b,p)=>{const A=a.match(/\w\w/g).map(x=>parseInt(x,16)),B=b.match(/\w\w/g).map(x=>parseInt(x,16));return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*p).toString(16).padStart(2,'0')).join('')};
   const accent=r=>r>330?'#2c86cf':r>300?hex('#2c86cf','#35b66f',(330-r)/30):r>90?'#35b66f':r>60?hex('#35b66f','#d4b83f',(90-r)/30):r>10?'#d4b83f':r>0?hex('#d4b83f','#d84242',(10-r)/10):'#d84242';
   const tick=()=>{
    if(serial!==sabbathTimerSerial)return;
    let r=d.running&&Number(d.endAt)>0?Math.max(0,Math.ceil((Number(d.endAt)-Date.now())/1000)):Math.max(0,Number(d.remaining)||0);
    const done=!!d.finished||r<=0,mins=Math.floor(r/60),secs=Math.floor(r%60),a=accent(r);
    stage.style.setProperty('--accent',a);fill.style.width=(Math.max(0,Math.min(1,r/total))*100)+'%';
    if(done){stage.classList.add('st-final');time.textContent='LIÇÃO DA ESCOLA SABATINA FINALIZADA';caption.textContent='TEMPO ENCERRADO'}
    else{stage.classList.remove('st-final');time.textContent=String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');caption.textContent=d.running?'TEMPO RESTANTE':'CRONÔMETRO PAUSADO'}
    if(d.running&&!done)setTimeout(tick,250);
   };tick();
  }catch(e){out.textContent='Não foi possível exibir o cronômetro.'}
 }else if(t.startsWith('IASD_YOUTUBE:')){
  try{
   const media=JSON.parse(t.slice('IASD_YOUTUBE:'.length));
   if(typeof media.id!=='string'||!/^[a-zA-Z0-9_-]{11}$/.test(media.id))throw Error('ID inválido');
   out.classList.add('youtube-mode');const wrap=document.createElement('div');wrap.style.cssText='position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden;background:#000';
   const frame=document.createElement('iframe');
   frame.src='https://www.youtube-nocookie.com/embed/'+media.id+'?autoplay='+(isPreview?'0':'1')+'&rel=0&playsinline=1';
   frame.title='Vídeo do YouTube';frame.allow='autoplay;encrypted-media;picture-in-picture;fullscreen';
   frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';
   frame.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;display:block;max-width:none;max-height:none';
   wrap.append(frame);out.append(wrap);
  }catch(e){out.textContent='Não foi possível preparar o vídeo do YouTube.'}
 }else if(t.startsWith('IASD_LOCAL_MEDIA:')){
  try{
   const media=JSON.parse(t.slice('IASD_LOCAL_MEDIA:'.length));
   if(!['audio','video'].includes(media.kind)||typeof media.url!=='string'||!(media.url.startsWith('blob:'+location.origin+'/')||/^http:\/\/127\.0\.0\.1:38741\/media\/[a-f0-9]{32}$/.test(media.url)||/^https:\/\/gtsaaixuampeaivugxdm\.supabase\.co\/storage\/v1\/object\/public\/iasd-offering-videos\/[a-zA-Z0-9_./%-]+$/.test(media.url)))throw Error('Arquivo inválido');
   out.classList.add('local-media-mode');const el=document.createElement(media.kind);el.src=media.url;el.controls=!isPreview;el.autoplay=!isPreview;el.muted=isPreview;el.volume=isPreview?0:Math.max(0,Math.min(1,Number(media.volume??.75)));if(media.kind==='video'){el.setAttribute('playsinline','');el.style.cssText='position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;margin:0!important;padding:0!important;object-fit:contain!important;background:#000!important;z-index:9999!important;'}out.append(el);
   if(!isPreview)el.play().catch(()=>{const msg=document.createElement('p');msg.textContent='Clique no botão de reprodução para iniciar a mídia.';msg.style.fontSize='20px';out.append(msg)});
  }catch(e){out.textContent='Não foi possível carregar esta mídia. Abra o telão neste navegador e tente novamente.'}
 }else if(t.startsWith('IASD_IMAGE:')){
  const url=t.slice(11);
  if(url.startsWith(allowed)){const img=document.createElement('img');img.src=url;img.alt='Imagem projetada';out.append(img)}
  else out.textContent='Imagem indisponível';
 }else out.textContent=t.replace(/\\n/g,'\n');
}
const channel=typeof BroadcastChannel==='function'?new BroadcastChannel('iasd-stage'):null;
if(channel){channel.onmessage=e=>show(e.data);channel.postMessage({type:'projection-ready'})}
window.addEventListener('storage',e=>{if(e.key==='iasd-stage')show(e.newValue)});
async function setProjectionFullscreen(enable){
 if(isPreview)return;
 try{
  if(enable&&!document.fullscreenElement)await document.documentElement.requestFullscreen({navigationUI:'hide'});
  if(!enable&&document.fullscreenElement)await document.exitFullscreen();
  window.opener?.postMessage({type:'projection-fullscreen-result',active:!!document.fullscreenElement},location.origin);
 }catch(e){
  window.opener?.postMessage({type:'projection-fullscreen-result',active:!!document.fullscreenElement,blocked:true},location.origin);
 }
}
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||!e.data)return;
 if(e.data.type==='iasd-project')show(e.data.content);
 if(e.data.type==='iasd-fullscreen')void setProjectionFullscreen(!!e.data.enable);
 if(e.data.type==='iasd-projection-background')applyProjectionBackground(e.data.color);
 if(e.data.type==='iasd-projection-visual')applyProjectionVisual(e.data);
 if(e.data.type==='iasd-studio-volume'){const v=Math.max(0,Math.min(1,Number(e.data.value)||0));out.querySelectorAll('audio,video').forEach(el=>el.volume=v)}
});
function applyProjectionBackground(value){const color=/^#[0-9a-f]{6}$/i.test(String(value||''))?String(value).toLowerCase():'#080e19';document.documentElement.style.setProperty('--projection-bg',color)}
function projectionVisualDb(){return new Promise((ok,fail)=>{const q=indexedDB.open('iasd-projection-backgrounds-v1',1);q.onupgradeneeded=()=>q.result.createObjectStore('images',{keyPath:'id'});q.onsuccess=()=>ok(q.result);q.onerror=()=>fail(q.error)})}
let projectionVisualObjectUrl='';
async function resolveProjectionImage(id,fallback){if(!id)return fallback||'';try{const db=await projectionVisualDb(),item=await new Promise((ok,fail)=>{const q=db.transaction('images').objectStore('images').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>fail(q.error)});db.close();if(item?.blob){if(projectionVisualObjectUrl)URL.revokeObjectURL(projectionVisualObjectUrl);projectionVisualObjectUrl=URL.createObjectURL(item.blob);return projectionVisualObjectUrl}}catch(e){}return fallback||''}
async function applyProjectionVisual(v={}){const id=v.imageId??localStorage.getItem('iasd-projection-bg-image-id')??'',fallback=v.imageUrl??localStorage.getItem('iasd-projection-bg-image-url')??'',fit=v.fit||localStorage.getItem('iasd-projection-fit')||'cover',transition=v.transition||localStorage.getItem('iasd-projection-transition')||'fade',logo=v.logo??localStorage.getItem('iasd-projection-logo')??'';const url=await resolveProjectionImage(id,fallback);document.body.style.backgroundImage=url?'url("'+url.replace(/"/g,'%22')+'")':'none';document.body.style.backgroundRepeat='no-repeat';document.body.style.backgroundPosition='center';document.body.style.backgroundSize=fit==='contain'?'contain':fit==='center'?'auto':'cover';out.style.transition=transition==='none'?'none':'opacity .35s ease';let mark=document.getElementById('iasd-projection-logo-overlay');if(!mark){mark=document.createElement('img');mark.id='iasd-projection-logo-overlay';mark.alt='';Object.assign(mark.style,{position:'fixed',left:'4vw',top:'4vh',maxWidth:'18vw',maxHeight:'16vh',objectFit:'contain',zIndex:'30',pointerEvents:'none'});document.body.append(mark)}mark.src=logo||'';mark.style.display=logo?'block':'none'}
applyProjectionBackground(localStorage.getItem('iasd-projection-bg')||'#080e19');
applyProjectionVisual();
window.addEventListener('storage',e=>{if(e.key==='iasd-projection-bg')applyProjectionBackground(e.newValue)});
show(localStorage.getItem('iasd-stage')||'');
if(window.opener)try{window.opener.postMessage({type:'projection-ready'},location.origin)}catch(e){}
</script></body></html>
