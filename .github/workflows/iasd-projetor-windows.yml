name: Compilar IASD Projetor (Windows)
on:
  workflow_dispatch:
  push:
    tags:
      - 'iasd-projetor-v*'
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: iasd-projetor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar versão da tag
        if: startsWith(github.ref, 'refs/tags/iasd-projetor-v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $expected = "iasd-projetor-v$version"
          if ("${{ github.ref_name }}" -ne $expected) { throw "A tag precisa ser $expected" }
      - name: Instalar dependências
        run: npm install
      - name: Compilar instalador Windows
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Disponibilizar instalador para testes
        uses: actions/upload-artifact@v4
        with:
          name: IASD-Projetor-Windows
          path: iasd-projetor/dist/*.exe
          if-no-files-found: error
      - name: Publicar release quando houver tag
        if: startsWith(github.ref, 'refs/tags/iasd-projetor-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            iasd-projetor/dist/*.exe
            iasd-projetor/dist/*.blockmap
            iasd-projetor/dist/latest.yml
          generate_release_notes: true
          prerelease: false
