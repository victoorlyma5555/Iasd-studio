name: Compilar IASD Projetor (Windows)
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'iasd-projetor/**'
      - '.github/workflows/iasd-projetor-windows.yml'
    tags:
      - 'iasd-projetor-v*'
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: iasd-projetor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar versão da tag
        if: startsWith(github.ref, 'refs/tags/iasd-projetor-v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $expected = "iasd-projetor-v$version"
          if ("${{ github.ref_name }}" -ne $expected) { throw "A tag precisa ser $expected" }
      - name: Instalar dependências
        run: npm install
      - name: Compilar instalador Windows
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Disponibilizar instalador para testes
        uses: actions/upload-artifact@v4
        with:
          name: IASD-Projetor-Windows
          path: iasd-projetor/dist/*.exe
          if-no-files-found: error
      - name: Publicar versão para atualizações automáticas
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "iasd-projetor-v$version"
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "A versão $tag já foi publicada. Para lançar uma nova atualização, aumente a versão no package.json."
            exit 0
          }
          gh release create $tag dist/*.exe dist/*.blockmap dist/latest.yml --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "IASD Projetor v$version" --generate-notes --latest=false

