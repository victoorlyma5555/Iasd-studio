name: Compilar IASD Projetor (Windows)
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'iasd-projetor/**'
      - '.github/workflows/iasd-projetor-windows.yml'
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: iasd-projetor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install
      - name: Compilar instalador Windows
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Disponibilizar instalador para testes
        uses: actions/upload-artifact@v4
        with:
          name: IASD-Projetor-Windows
          path: iasd-projetor/dist/*.exe
          if-no-files-found: error
      - name: Publicar versão para atualizações automáticas
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "iasd-projetor-v$version"
          $existing = gh release view $tag --repo "${{ github.repository }}" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Versão $tag já publicada. Aumente a versão para uma nova atualização."
            exit 0
          }
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '(?i)\.exe$|\.blockmap$|^latest\.yml$' } | ForEach-Object { $_.FullName })
          if (-not ($assets | Where-Object { $_ -match 'latest\.yml$' })) {
            throw 'latest.yml não foi gerado; publicação interrompida.'
          }
          gh release create $tag $assets --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "IASD Projetor v$version" --generate-notes --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar release.' }
