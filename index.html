<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IASD Studio</title><style>:root{font-family:system-ui;background:#07111e;color:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#101f32;padding:18px 24px;border-bottom:1px solid #30445d;display:flex;justify-content:space-between;align-items:center}h1{margin:0;color:#e5bf65}main{max-width:1100px;margin:auto;padding:20px}nav{display:flex;gap:8px;overflow:auto;padding:12px 0}button,input,textarea,select{font:inherit;border-radius:9px;padding:10px;border:1px solid #455b74;background:#192d44;color:white}button{cursor:pointer}button:hover,.active{background:#a47e36;color:#fff}.panel{background:#102238;border:1px solid #30435c;border-radius:14px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}input,textarea{width:100%;margin:6px 0}li{padding:8px;border-bottom:1px solid #31465c}.muted{color:#b1c1d2}#stage{min-height:160px;display:grid;place-items:center;font-size:36px;text-align:center;white-space:pre-wrap}.hide{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}small{color:#b1c1d2}</style></head><body><header><div><h1>IASD STUDIO</h1><small>Central de sonoplastia e projeção</small></div><button onclick="openProjection()">Abrir projetor ↗</button></header><main><nav id="tabs"></nav><section id="content"></section></main><script>
const tabs=['Painel','Cronograma','Escalas','Sorteadores','Mídia','Bíblia','Datas especiais'];let current='Painel';const initial={cronograma:[],escalas:[],datas:[],sorteados:[],stage:'IASD STUDIO',media:[]};let data;try{data={...initial,...JSON.parse(localStorage.getItem('iasd-studio')||'{}')}}catch{data={...initial}}const save=()=>{localStorage.setItem('iasd-studio',JSON.stringify(data));render()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=id=>document.getElementById(id);function project(t){data.stage=t;localStorage.setItem('iasd-studio',JSON.stringify(data));localStorage.setItem('iasd-stage',t);$('stage')&&($('stage').textContent=t);try{channel.postMessage(t)}catch{}}const channel=new BroadcastChannel('iasd-stage');function openProjection(){const w=window.open('','iasd-projection');if(!w){alert('Permita janelas pop-up para abrir o projetor');return}w.document.write('<!doctype html><html><meta charset="utf-8"><title>Projeção IASD</title><style>body{margin:0;background:#000;color:#fff;display:grid;place-items:center;height:100vh;font:clamp(30px,5vw,90px) system-ui;text-align:center;white-space:pre-wrap;padding:4vw;box-sizing:border-box}</style><main id="out"></main><script>document.getElementById("out").textContent=localStorage.getItem("iasd-stage")||"IASD STUDIO";const ch=new BroadcastChannel("iasd-stage");ch.onmessage=e=>document.getElementById("out").textContent=e.data;window.addEventListener("storage",e=>{if(e.key==="iasd-stage")document.getElementById("out").textContent=e.newValue});<\/script></html>');w.document.close()}function itemList(key){return '<ul>'+data[key].map((x,i)=>'<li>'+esc(x)+' <button onclick="removeItem(\''+key+'\','+i+')">Excluir</button> <button onclick="project('+JSON.stringify(x).replace(/"/g,'&quot;')+')">Projetar</button></li>').join('')+'</ul>'}function removeItem(key,i){data[key].splice(i,1);save()}function addItem(key){const el=$('new-'+key);if(el.value.trim()){data[key].push(el.value.trim());save()}}function section(key,title,placeholder){return '<div class="panel"><h2>'+title+'</h2><input id="new-'+key+'" placeholder="'+placeholder+'"><button onclick="addItem(\''+key+'\')">Adicionar</button>'+itemList(key)+'</div>'}function render(){ $('tabs').innerHTML=tabs.map(t=>'<button class="'+(t===current?'active':'')+'" onclick="current=\''+t+'\';render()">'+t+'</button>').join('');let out='';if(current==='Painel')out='<div class="grid"><div class="panel"><h2>Ao vivo / Prévia</h2><div id="stage">'+esc(data.stage)+'</div><textarea id="custom" placeholder="Digite aviso ou mensagem"></textarea><div class="actions"><button onclick="project($(\'custom\').value)">Projetar texto</button><button onclick="project(\'\')">Tela preta</button><button onclick="openProjection()">Abrir segunda tela</button></div></div><div class="panel"><h2>Hoje</h2><h3>Cronograma</h3>'+itemList('cronograma')+'<h3>Escalas</h3>'+itemList('escalas')+'</div></div>';if(current==='Cronograma')out=section('cronograma','Cronograma do culto','Horário — atividade — responsável');if(current==='Escalas')out=section('escalas','Escalados do dia e do mês','Data — nome — função');if(current==='Datas especiais')out=section('datas','Datas especiais','Data — evento');if(current==='Sorteadores')out='<div class="panel"><h2>Provai e Vede / Culto do lar</h2><textarea id="names" rows="6" placeholder="Um nome por linha"></textarea><label><input type="checkbox" id="unique" style="width:auto" checked> Evitar repetição nesta sessão</label><div class="actions"><button onclick="drawNames()">Sortear pessoa</button><button onclick="data.sorteados=[];save()">Reiniciar histórico</button></div><p id="drawresult"></p><h3>Histórico</h3><p>'+esc(data.sorteados.join(', '))+'</p></div><div class="panel"><h2>Sorteio de números</h2><label>De <input type="number" id="min" value="1"></label><label>Até <input type="number" id="max" value="100"></label><button onclick="drawNumber()">Sortear número</button><p id="numresult"></p></div>';if(current==='Mídia')out='<div class="panel"><h2>Biblioteca de mídia local</h2><p class="muted">Selecione um arquivo do computador. O arquivo não é enviado ao servidor nem fica salvo após fechar a página.</p><input type="file" id="mediafile" accept="audio/*,video/*,image/*" onchange="loadMedia(this)"><div id="player"></div><h3>Favoritos e playlists</h3><p>Use arquivos próprios autorizados. A persistência dos arquivos requer armazenamento em nuvem ou instalação local.</p></div>';if(current==='Bíblia')out='<div class="panel"><h2>Projeção de versículos</h2><p>Digite ou cole um texto bíblico que você tenha autorização para utilizar.</p><input id="ref" placeholder="Livro capítulo:versículo"><textarea id="verse" rows="6" placeholder="Texto do versículo"></textarea><button onclick="project($(\'ref\').value+\'\\n\'+$(\'verse\').value)">Projetar versículo</button></div>'; $('content').innerHTML=out}function drawNames(){const names=$('names').value.split('\n').map(x=>x.trim()).filter(Boolean);const pool=$('unique').checked?names.filter(n=>!data.sorteados.includes(n)):names;if(!pool.length){$('drawresult').textContent='Sem nomes disponíveis';return}const name=pool[Math.floor(Math.random()*pool.length)];data.sorteados.push(name);project(name);render();$('names').value=names.join('\n');$('drawresult').textContent='Sorteado: '+name}function drawNumber(){const a=Number($('min').value),b=Number($('max').value);if(!Number.isInteger(a)||!Number.isInteger(b)||b<a){alert('Intervalo inválido');return}const n=a+Math.floor(Math.random()*(b-a+1));$('numresult').textContent='Número: '+n;project(String(n))}let mediaURL;function loadMedia(input){if(mediaURL)URL.revokeObjectURL(mediaURL);const file=input.files[0];if(!file)return;mediaURL=URL.createObjectURL(file);const el=file.type.startsWith('video/')?'video':file.type.startsWith('audio/')?'audio':'img';$('player').innerHTML='<'+el+' src="'+mediaURL+'" controls style="max-width:100%;max-height:60vh" '+(el==='img'?'alt="Prévia"':'')+'></'+el+'>'}render();</script></body></html>
