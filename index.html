ure .glyph{background:#624823;color:#ffd88a;border:1px solid #d2a65d}.tile:active{transform:scale(.98)}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:26px 3px 12px}.sectionhead h2{font-size:18px;margin:0}.panel{padding:18px;margin:16px 0}.panel h2{font-size:20px;margin:0 0 16px}.panel h3{font-size:15px}.panel p,.muted{color:#b8c0cc}.panel input,.panel textarea{width:100%;background:#0a1421;border:1px solid #394658;border-radius:12px;padding:13px;color:#fff;margin:7px 0 12px;outline:none}.panel input[type=checkbox]{width:auto}.panel button,.action{background:#263b54;padding:12px 16px;border-radius:12px;font-weight:650;margin:4px 4px 4px 0}.panel button.primary,.action.primary{background:#d2a451;color:#14110c}.actions{display:flex;gap:6px;flex-wrap:wrap}ul{list-style:none;padding:0}li{padding:12px 0;border-bottom:1px solid #29384a;overflow-wrap:anywhere}li button{font-size:12px}#stage{min-height:130px;background:#05090e;border-radius:15px;display:grid;place-items:center;padding:16px;text-align:center;white-space:pre-wrap;font-size:24px;color:#fff}.schedule{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:0 0 0 2px;margin:0;position:relative}.schedule .time{color:#d4a957;font-weight:750;font-variant-numeric:tabular-nums;padding-top:17px;font-size:14px}.schedule .event{border-left:2px solid #334253;padding:15px 0 19px 18px;min-width:0;position:relative}.schedule .event:before{content:'';position:absolute;width:9px;height:9px;left:-6px;top:21px;background:#d4a957;border-radius:50%;box-shadow:0 0 0 4px #182434}.schedule:last-child .event{border-left-color:transparent}.schedule .event strong{display:block;color:#f6f5f4;font-size:15px;line-height:1.35}.schedule .event small{display:block;color:#aeb9c8;font-size:13px;margin-top:5px}.schedule .event .itemactions{display:flex;gap:7px;margin-top:9px}.schedule .event .itemactions button{font-size:11px;padding:6px 9px;margin:0;background:#263b54}.schedule b{color:#e9ba68}.bottomnav{p /* Tema claro IASD Studio: mantém o layout e a tela de projeção escura */
:root{color-scheme:light;color:#203047;background:#f5f7fb}
body{color:#203047;background:radial-gradient(ellipse at 85% -12%,#e7eefb 0%,transparent 47%),#f5f7fb}

.iconbtn{color:#34435b;border-color:#dbe2ec;background:#fff;box-shadow:0 3px 12px #23344b0c}

.tile small,.panel p,.muted{color:#65758a}

.panel button.primary,.action.primary{background:#d9ad5d;color:#30220c}
li{border-color:#e6ebf2}
.schedule .time,.schedule b{color:#a77726}
.schedule .event{border-left-color:#dbe2eb}
.schedule .event:before{background:#c69640;box-shadow:0 0 0 4px #f4f6fa}
.schedule .event strong{color:#26364b}.schedule .event small{color:#728097}
.schedule .event .itemactions button{background:#eaf0f8;color:#324761}

header h1{color:#fff}header h1 span{color:#f3c475}header small{color:#e0e5ed}.brandmark{color:#e7b75c}

.bottomnav button{color:#f1f3f7}.bottomnav button.active{color:#f7c56d}.bottomnav .projectnav span{background:linear-gradient(145deg,#f9d28c,#b67b19);border:5px solid #e9e9e9;color:#fff}
.schedule-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.schedule-group{display:flex;flex-direction:column;gap:7px;text-align:left;padding:15px;background:#f4f7fc;color:#19345a;border:2px solid #e0e7f0;border-radius:14px;min-height:88px}.schedule-group strong{font-size:14px;line-height:1.35}.schedule-group small{font-size:12px;color:#61748e}.schedule-group.selected{border-color:#c99a46;background:#fff8e9}.panel button.danger-btn{background:#fee8e8;color:#a32d38}.panel label{display:block;font-weight:650;margin-top:12px;margin-bottom:4px;color:#233b5e}@media(min-width:780px){.schedule-groups{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><header><div class="brand"><span class="brandmark" aria-hidden="true">✦</span><div><h1>IASD <span>STUDIO</span></h1><small>SONOPLASTIA E PROJEÇÃO</small></div></div><button class="iconbtn" onclick="current='Mais';render()" aria-label="Configurações">⚙</button></header><main><section id="content"></section></main><nav class="bottomnav" id="tabs" aria-label="Navegação principal"></nav><script>
const tabs=['Painel','Cronograma','Escalas','Sorteadores','Mídia','Bíblia','Datas especiais'];let current='Painel';const initial={cronograma:[],escalas:[],datas:[],sorteados:[],stage:'IASD STUDIO',media:[]};let data;try{data={...initial,...JSON.parse(localStorage.getItem('iasd-studio')||'{}')}}catch{data={...initial}}const save=()=>{localStorage.setItem('iasd-studio',JSON.stringify(data));render()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=id=>document.getElementById(id);function project(t){data.stage=t;localStorage.setItem('iasd-studio',JSON.stringify(data));localStorage.setItem('iasd-stage',t);$('stage')&&($('stage').textContent=t);try{channel.postMessage(t)}catch{}}const channel=new BroadcastChannel('iasd-stage');let projectionWindow=null;function stopProjection(){if(projectionWindow&&!projectionWindow.closed){projectionWindow.close()}projectionWindow=null;project('');render()}function openProjection(){const w=window.open('','iasd-projection');if(!w){alert('Permita janelas pop-up para abrir o projetor');return}w.document.write('<!doctype html><html><meta charset="utf-8"><title>Projeção IASD</title><style>body{margin:0;background:#000;color:#fff;display:grid;place-items:center;height:100vh;font:clamp(30px,5vw,90px) system-ui;text-align:center;white-space:pre-wrap;padding:4vw;box-sizing:border-box}</style><main id="out"></main><script>document.getElementById("out").textContent=localStorage.getItem("iasd-stage")||"IASD STUDIO";const ch=new BroadcastChannel("iasd-stage");ch.onmessage=e=>document.getElementById("out").textContent=e.data;window.addEventListener("storage",e=>{if(e.key==="iasd-stage")document.getElementById("out").textContent=e.newValue});<\/script></html>');w.document.close();projectionWindow=w}function itemList(key){return '<ul>'+data[key].map((x,i)=>'<li>'+esc(x)+' <button onclick="removeItem(\''+key+'\','+i+')">Excluir</button> <button onclick="project('+JSON.stringify(x).replace(/"/g,'&quot;')+')">Projetar</button></li>').join('')+'</ul>'}function removeItem(key,i){data[key].splice(i,1);save()}function addItem(key){const el=$('new-'+key);if(el.value.trim()){data[key].push(el.value.trim());save()}}function parseSchedule(x){const parts=String(x).split(/\s+[—–-]\s+/);return {time:/^\d{1,2}:\d{2}$/.test(parts[0]||'')?parts.shift():'•',title:parts.shift()||String(x),person:parts.join(' — ')}}function scheduleList(items,editable=false){return items.length?items.map((x,i)=>{const a=parseSchedule(x);return '<div class="schedule"><span class="time">'+esc(a.time)+'</span><div class="event"><strong>'+esc(a.title)+'</strong>'+(a.person?'<small>'+esc(a.person)+'</small>':'')+(editable?'<div class="itemactions"><button onclick="project(data.cronogramas.find(g=>g.id===selectedSchedule).items['+i+'])">Projetar</button><button onclick="removeScheduleLine('+i+')">Excluir atividade</button></div>':'')+'</div></div>'}).join(''):'<p class="muted">Nenhuma atividade cadastrada.</p>'}function section(key,title,placeholder){return '<div class="panel"><h2>'+title+'</h2><input id="new-'+key+'" placeholder="'+placeholder+'"><button onclick="addItem(\''+key+'\')">Adicionar</button>'+itemList(key)+'</div>'}
let selectedSchedule=null,editingSchedule=null;
function scheduleId(){return 'culto-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)}
function ensureSchedules(){if(!Array.isArray(data.cronogramas))data.cronogramas=[];if(data.cronograma?.length){data.cronogramas.unshift({id:scheduleId(),name:'Cronograma anterior',date:'',items:[...data.cronograma]});data.cronograma=[];localStorage.setItem('iasd-studio',JSON.stringify(data))}if(!selectedSchedule&&data.cronogramas.length)selectedSchedule=data.cronogramas[0].id}
function showSchedule(id){selectedSchedule=id;editingSchedule=null;render()}
function newSchedule(){editingSchedule='new';render()}
function editSchedule(id){editingSchedule=id;selectedSchedule=id;render()}
function cancelSchedule(){editingSchedule=null;render()}
function saveSchedule(){const name=$('schedule-name')?.value.trim(),date=$('schedule-date')?.value||'',items=$('schedule-lines')?.value.split('\n').map(x=>x.trim()).filter(Boolean)||[];if(!name){alert('Digite um nome para o cronograma.');return}if(!items.length){alert('Adicione pelo menos uma atividade.');return}if(editingSchedule==='new'){const id=scheduleId();data.cronogramas.unshift({id,name,date,items});selectedSchedule=id}else{const group=data.cronogramas.find(g=>g.id===editingSchedule);if(!group)return;Object.assign(group,{name,date,items});selectedSchedule=group.id}editingSchedule=null;save()}
function deleteSchedule(id){const g=data.cronogramas.find(x=>x.id===id);if(!g||!confirm('Excluir todo o cronograma "'+g.name+'"? Esta ação não pode ser desfeita.'))return;data.cronogramas=data.cronogramas.filter(x=>x.id!==id);selectedSchedule=data.cronogramas[0]?.id||null;editingSchedule=null;save()}
function removeScheduleLine(i){const g=data.cronogramas.find(x=>x.id===selectedSchedule);if(!g)return;g.items.splice(i,1);save()}
function schedulePage(){ensureSchedules();const group=data.cronogramas.find(g=>g.id===selectedSchedule);let html='<div class="panel"><div class="sectionhead" style="margin:0 0 15px"><h2>Meus cronogramas</h2><button class="primary" onclick="newSchedule()">+ Novo</button></div><p class="muted">Cada culto fica separado. Escolha um cronograma para visualizar, editar ou excluir.</p><div class="schedule-groups">'+data.cronogramas.map(g=>'<button class="schedule-group '+(g.id===selectedSchedule?'selected':'')+'" onclick="showSchedule(\''+g.id+'\')"><strong>'+esc(g.name)+'</strong><small>'+(g.date?esc(g.date.split('-').reverse().join('/'))+' · ':'')+g.items.length+' atividades</small></button>').join('')+'</div></div>';if(editingSchedule){const g=editingSchedule==='new'?{name:'',date:'',items:[]}:data.cronogramas.find(x=>x.id===editingSchedule);html+='<div class="panel"><h2>'+(editingSchedule==='new'?'Novo cronograma':'Editar cronograma')+'</h2><label for="schedule-name">Nome do culto</label><input id="schedule-name" placeholder="Ex.: Culto de sábado — manhã" value="'+esc(g.name)+'"><label for="schedule-date">Data (opcional)</label><input type="date" id="schedule-date" value="'+esc(g.date)+'"><label for="schedule-lines">Atividades (uma por linha)</label><textarea id="schedule-lines" rows="9" placeholder="09:00 — Abertura — Ana Paula&#10;09:15 — Louvor — Equipe de música">'+esc(g.items.join('\n'))+'</textarea><div class="actions"><button class="primary" onclick="saveSchedule()">✓ Salvar cronograma</button><button onclick="cancelSchedule()">Cancelar</button></div></div>';return html}if(group){html+='<div class="panel"><div class="sectionhead" style="margin:0 0 14px"><div><h2>'+esc(group.name)+'</h2>'+(group.date?'<p class="muted">'+esc(group.date.split('-').reverse().join('/'))+'</p>':'')+'</div></div><div class="actions"><button class="primary" onclick="editSchedule(\''+group.id+'\')">✎ Editar</button><button class="danger-btn" onclick="deleteSchedule(\''+group.id+'\')">Excluir cronograma</button></div><div class="sectionhead"><h2>Programação</h2><span class="muted">'+group.items.length+' atividades</span></div>'+scheduleList(group.items,true)+'</div>'}else html+='<div class="panel"><h2>Nenhum cronograma ainda</h2><p class="muted">Toque em + Novo para cadastrar o primeiro culto.</p></div>';return html}
function go(t){current=t;render();window.scrollTo({top:0,behavior:'smooth'})}function tile(t,sub,glyph,color,featured){return '<button class="tile '+(featured?'feature':'')+'" onclick="go(\''+t+'\')"><span class="glyph">'+glyph+'</span><strong>'+t+'</strong><small>'+sub+'</small><span class="tile-arrow">›</span></button>'}function render(){
const nav=[['Painel','⌂','Início'],['Cronograma','▦','Agenda'],['Mídia','▱','Biblioteca'],['Projeção','▶','Projetor'],['Bíblia','▤','Bíblia'],['Mais','☰','Mais']];
$('tabs').innerHTML=nav.map(([t,i,n])=>'<button class="'+(current===t?'active ':'')+(t==='Projeção'?'projectnav':'')+'" onclick="go(\''+t+'\')"><span>'+i+'</span>'+n+'</button>').join('');
let out='';
if(current==='Painel'){ensureSchedules()}if(current==='Painel')out='<div class="hero"><span class="eyebrow">BEM-VINDO</span><h2>Organize, projete<br>e <em>edifique.</em></h2><span class="goldline"></span><p>Ferramentas para tornar seu culto mais eficiente e abençoado.</p><span class="hero-watermark">✦</span></div><div class="grid">'+tile('Projeção','Controle a segunda tela e apresente seu conteúdo.','▶','#b78127',true)+tile('Cronograma','Organize o cronograma do culto com horários e responsáveis.','▦','#155fc5')+tile('Bíblia','Pesquise versículos online e projete na televisão.','▤','#155fc5')+tile('Escalas','Gerencie as escalas de sonoplastia, projeção e equipe.','♟','#b78127')+tile('Mídia','Tenha seus hinos, apresentações e mídias sempre à mão.','▥','#b78127')+tile('Mais','Acesse outras ferramentas e configurações.','▦','#155fc5')+'</div><div class="verse-card"><span class="stripe"></span><div><blockquote>“Tudo o que fizerem, façam de todo o coração, como para o Senhor.”</blockquote><small>COLOSSENSES 3:23</small></div></div>'+(data.cronogramas.length?'<div class="panel"><div class="sectionhead"><h2>'+esc(data.cronogramas.find(g=>g.id===selectedSchedule)?.name||data.cronogramas[0].name)+'</h2><button onclick="go(\'Cronograma\')">Ver completo ›</button></div>'+scheduleList((data.cronogramas.find(g=>g.id===selectedSchedule)||data.cronogramas[0]).items)+'</div>':'');
if(current==='Projeção')out='<div class="sectionhead"><h2>Controle de projeção</h2></div><div class="panel"><h2>Prévia da tela</h2><div id="stage">'+esc(data.stage)+'</div><textarea id="custom" rows="4" placeholder="Digite o texto para projetar"></textarea><div class="actions"><button class="primary" onclick="project($(\'custom\').value)">▶ Projetar</button><button onclick="project(\'\')">Tela preta</button><button onclick="openProjection()">▣ Segunda tela</button><button style="background:#69333a" onclick="stopProjection()">■ Parar projeção</button></div><p class="muted">A segunda tela funciona no mesmo navegador. O controle entre dispositivos será adicionado em outra etapa.</p></div>';
if(current==='Cronograma')out=schedulePage();
if(current==='Escalas')out=section('escalas','Escalados do dia e do mês','Data — nome — função');
if(current==='Datas especiais')out=section('datas','Datas especiais','Data — evento');
if(current==='Sorteadores')out='<div class="panel"><h2>Provai e Vede / Culto do lar</h2><textarea id="names" rows="6" placeholder="Um nome por linha"></textarea><label><input type="checkbox" id="unique" checked> Evitar repetição nesta sessão</label><div class="actions"><button class="primary" onclick="drawNames()">Sortear pessoa</button><button onclick="data.sorteados=[];save()">Reiniciar histórico</button></div><p id="drawresult"></p><h3>Histórico</h3><p>'+esc(data.sorteados.join(', '))+'</p></div><div class="panel"><h2>Sorteio de números</h2><label>De <input type="number" id="min" value="1"></label><label>Até <input type="number" id="max" value="100"></label><button class="primary" onclick="drawNumber()">Sortear número</button><p id="numresult"></p></div>';
if(current==='Mídia')out='<div class="panel"><h2>Biblioteca de mídia</h2><p>Reproduza músicas, vídeos e imagens do seu dispositivo.</p><input type="file" id="mediafile" accept="audio/*,video/*,image/*" onchange="loadMedia(this)"><div id="player"></div><p class="muted">Os arquivos não são enviados nem salvos no servidor. Utilize somente conteúdo autorizado.</p></div>';
if(current==='Bíblia')out=bibleUI();
if(current==='Mais')out='<div class="sectionhead"><h2>Mais ferramentas</h2></div><div class="grid">'+tile('Escalas','Equipe e responsáveis','♟','#b194ff')+tile('Sorteadores','Provai e Vede e números','⤨','#73e0a5')+tile('Datas especiais','Datas da igreja','✧','#cda1ff')+'</div><div class="panel"><h2>IASD Studio</h2><p>As informações são salvas neste navegador. Não coloque dados pessoais sensíveis em dispositivos compartilhados.</p><button onclick="openProjection()">Abrir projetor</button></div>';
$('content').innerHTML=out;if(current==='Bíblia')updateBibleChapters();
}
const bibleBooks=[["Gênesis","genesis"],["Êxodo","exodus"],["Levítico","leviticus"],["Números","numbers"],["Deuteronômio","deuteronomy"],["Josué","joshua"],["Juízes","judges"],["Rute","ruth"],["1 Samuel","1 samuel"],["2 Samuel","2 samuel"],["1 Reis","1 kings"],["2 Reis","2 kings"],["1 Crônicas","1 chronicles"],["2 Crônicas","2 chronicles"],["Esdras","ezra"],["Neemias","nehemiah"],["Ester","esther"],["Jó","job"],["Salmos","psalms"],["Provérbios","proverbs"],["Eclesiastes","ecclesiastes"],["Cânticos","song of solomon"],["Isaías","isaiah"],["Jeremias","jeremiah"],["Lamentações","lamentations"],["Ezequiel","ezekiel"],["Daniel","daniel"],["Oseias","hosea"],["Joel","joel"],["Amós","amos"],["Obadias","obadiah"],["Jonas","jonah"],["Miqueias","micah"],["Naum","nahum"],["Habacuque","habakkuk"],["Sofonias","zephaniah"],["Ageu","haggai"],["Zacarias","zechariah"],["Malaquias","malachi"],["Mateus","matthew"],["Marcos","mark"],["Lucas","luke"],["João","john"],["Atos","acts"],["Romanos","romans"],["1 Coríntios","1 corinthians"],["2 Coríntios","2 corinthians"],["Gálatas","galatians"],["Efésios","ephesians"],["Filipenses","philippians"],["Colossenses","colossians"],["1 Tessalonicenses","1 thessalonians"],["2 Tessalonicenses","2 thessalonians"],["1 Timóteo","1 timothy"],["2 Timóteo","2 timothy"],["Tito","titus"],["Filemom","philemon"],["Hebreus","hebrews"],["Tiago","james"],["1 Pedro","1 peter"],["2 Pedro","2 peter"],["1 João","1 john"],["2 João","2 john"],["3 João","3 john"],["Judas","jude"],["Apocalipse","revelation"]];let bibleResult=null;function bibleUI(){return '<div class="panel"><h2>Pesquisar na Bíblia</h2><p class="muted">Selecione ou digite o capítulo e o versículo. Tradução: Almeida em português.</p><label for="bbook">Livro</label><select id="bbook" style="width:100%;background:#0a1421;border:1px solid #394658;border-radius:12px;padding:13px;color:white;margin:8px 0 14px" onchange="updateBibleChapters()">'+bibleBooks.map(([pt,en])=>'<option value="'+en+'" '+(en==='john'?'selected':'')+'>'+pt+'</option>').join('')+'</select><div class="grid"><div><label for="bchapter">Capítulo</label><select id="bchapterSelect" aria-label="Selecionar capítulo" onchange="syncBibleChapter(this.value)" style="width:100%;background:#0a1421;border:1px solid #394658;border-radius:12px;padding:13px;color:white;margin:8px 0"></select><input type="number" min="1" max="150" id="bchapter" value="" aria-label="Digitar capítulo" placeholder="Ou digite" oninput="syncBibleChapterSelect(this.value)"></div><div><label for="bverse">Versículo</label><select id="bverseSelect" aria-label="Selecionar versículo" onchange="syncBibleVerse(this.value)" style="width:100%;background:#0a1421;border:1px solid #394658;border-radius:12px;padding:13px;color:white;margin:8px 0"></select><input id="bverse" placeholder="Ou digite: 16 ou 16-18" value="" aria-label="Digitar versículo ou intervalo" oninput="syncBibleVerseSelect(this.value)"></div></div><button class="primary" onclick="searchBible()">⌕ Buscar versículo</button><div id="bresult" aria-live="polite" style="margin-top:16px"></div><p class="muted" style="font-size:12px">Seletores e digitação ficam sincronizados. A consulta exige internet.</p></div>'}const bibleChapterCounts=[50,40,27,36,34,24,21,4,31,24,22,25,29,36,10,13,10,42,150,31,12,8,66,52,5,48,12,14,3,9,1,4,7,3,3,3,2,14,4,28,16,24,21,28,16,16,13,6,6,4,4,5,3,6,4,3,1,13,5,5,3,5,1,1,1,22];function updateBibleChapters(){const index=$('bbook').selectedIndex,max=bibleChapterCounts[index]||150;const sel=$('bchapterSelect');sel.innerHTML='<option value="">Selecione</option>'+Array.from({length:max},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'</option>').join('');$('bchapter').max=max;$('bchapter').value='';sel.value='';$('bverse').value='';updateBibleVerses()}function syncBibleChapter(value){$('bchapter').value=value;$('bchapterSelect').value=value;updateBibleVerses()}function syncBibleChapterSelect(value){const n=Number(value);if(Number.isInteger(n)&&n>=1&&n<=Number($('bchapter').max)){$('bchapterSelect').value=String(n);updateBibleVerses()}}function syncBibleVerse(value){$('bverse').value=value;const out=$('bresult');if(out)out.innerHTML=''}function syncBibleVerseSelect(value){if(/^\d+$/.test(value)&&Number(value)>0&&Array.from($('bverseSelect').options).some(o=>o.value===value))$('bverseSelect').value=value;else $('bverseSelect').value=''}async function updateBibleVerses(){const sel=$('bverseSelect');if(!sel)return;const book=$('bbook').value,chapter=$('bchapter').value;const old=$('bverse').value;if(!chapter){sel.innerHTML='<option value="">Selecione o capítulo</option>';$('bverse').value='';return}sel.innerHTML='<option value="">Carregando...</option>';try{const r=await fetch('https://bible-api.com/'+encodeURIComponent(book+' '+chapter)+'?translation=almeida');if(!r.ok)throw Error();const json=await r.json();if(book!==$('bbook').value||chapter!==$('bchapter').value)return;const count=json.verses?.length||0;if(!count)throw Error();sel.innerHTML='<option value="">Selecione</option>'+Array.from({length:count},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'</option>').join('');if(/^\d+$/.test(old)&&Number(old)>=1&&Number(old)<=count)sel.value=old;else if(!old){sel.value='';$('bverse').value=''}}catch{sel.innerHTML='<option value="">Digite o versículo</option>'}}async function searchBible(){const book=$('bbook'),chapter=Number($('bchapter').value||$('bchapterSelect').value),v=($('bverse').value||$('bverseSelect').value).trim(),out=$('bresult');if(!Number.isInteger(chapter)||chapter<1||chapter>(bibleChapterCounts[book.selectedIndex]||150)||!/^\d{1,3}(?:-\d{1,3})?$/.test(v)){out.textContent='Informe capítulo e versículo válidos.';return}const [start,end]=v.split('-').map(Number);if(start<1||(end!==undefined&&(end<start||end-start>30))){out.textContent='Escolha um intervalo de até 31 versículos.';return}const ref=book.options[book.selectedIndex].text+' '+chapter+':'+v;out.textContent='Buscando '+ref+'...';try{const response=await fetch('https://bible-api.com/'+encodeURIComponent(book.value+' '+chapter+':'+v)+'?translation=almeida');if(!response.ok)throw Error('Versículo não encontrado');const result=await response.json();if(!result.text||!result.verses?.length)throw Error('Referência não encontrada');bibleResult={ref,text:result.text.trim()};out.innerHTML='<div class="panel" style="background:#1c2b3c"><h3>'+esc(ref)+'</h3><p style="white-space:pre-line;line-height:1.7;color:#f3f5f9">'+esc(bibleResult.text)+'</p><button class="primary" onclick="projectBible()">▶ Projetar na televisão</button></div>'}catch(e){out.textContent='Não foi possível carregar a passagem. Confira a referência e a conexão com a internet e tente novamente.'}}function projectBible(){if(!bibleResult)return;project(bibleResult.ref+'\\n\\n'+bibleResult.text);const el=$('bresult');if(el)el.insertAdjacentHTML('beforeend','<p style="color:#82d9ac">Enviado para a segunda tela. Abra o projetor se ainda não estiver aberto.</p>')}
function drawNames(){const names=$('names').value.split('\n').map(x=>x.trim()).filter(Boolean);const pool=$('unique').checked?names.filter(n=>!data.sorteados.includes(n)):names;if(!pool.length){$('drawresult').textContent='Sem nomes disponíveis';return}const name=pool[Math.floor(Math.random()*pool.length)];data.sorteados.push(name);project(name);render();$('names').value=names.join('\n');$('drawresult').textContent='Sorteado: '+name}function drawNumber(){const a=Number($('min').value),b=Number($('max').value);if(!Number.isInteger(a)||!Number.isInteger(b)||b<a){alert('Intervalo inválido');return}const n=a+Math.floor(Math.random()*(b-a+1));$('numresult').textContent='Número: '+n;project(String(n))}let mediaURL;function loadMedia(input){if(mediaURL)URL.revokeObjectURL(mediaURL);const file=input.files[0];if(!file)return;mediaURL=URL.createObjectURL(file);const el=file.type.startsWith('video/')?'video':file.type.startsWith('audio/')?'audio':'img';$('player').innerHTML='<'+el+' src="'+mediaURL+'" controls style="max-width:100%;max-height:60vh" '+(el==='img'?'alt="Prévia"':'')+'></'+el+'>'}render();</script></body></html>
