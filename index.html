let authSignupMode=false,authBusy=false,authNotice='';
function renderAuthModal(){const root=$('auth-modal-root');root.innerHTML='<div class="auth-backdrop" onclick="closeAuthModal()"></div><section class="auth-dialog" role="dialog" aria-modal="true" aria-label="Acesso da equipe"><button class="auth-close" onclick="closeAuthModal()" aria-label="Fechar">✕</button><div class="auth-brand">✦ <span>IASD <b>APP</b></span></div><div class="auth-hero"><span>ÁREA DA EQUIPE</span><h2>'+(authSignupMode?'Crie sua conta.':'Bem-vindo de volta.')+'</h2><p>'+(authSignupMode?'Cadastre-se para solicitar acesso à equipe da igreja.':'Entre para administrar e editar as informações da igreja.')+'</p></div>'+(authSignupMode?'<div class="auth-signup-fields"><label for="cloud-name">Nome completo</label><input id="cloud-name" type="text" autocomplete="name" minlength="3" maxlength="150" placeholder="Como deseja ser chamado" required><label for="cloud-whatsapp">Número do WhatsApp</label><input id="cloud-whatsapp" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" placeholder="(00) 00000-0000" required></div>':'')+(authNotice?'<div class="auth-success" role="status"><span class="auth-success-icon">✉</span><div><strong>Cadastro recebido!</strong><p>'+esc(authNotice)+'</p></div></div>':'')+'<form onsubmit="event.preventDefault();submitAuthModal()"><label for="cloud-email">E-mail</label><input id="cloud-email" type="email" autocomplete="email" placeholder="seu@email.com" required><label for="cloud-password">Senha</label><input id="cloud-password" type="password" autocomplete="'+(authSignupMode?'new-password':'current-password')+'" placeholder="Mínimo de 8 caracteres" minlength="8" required><p id="auth-feedback" role="alert"></p><button class="auth-submit" type="submit" '+(authBusy?'disabled':'')+'>'+(authSignupMode?'Criar conta':'Entrar')+'</button></form><div class="auth-switch">'+(authSignupMode?'Já tem uma conta? <button onclick="switchAuthMode(false)">Entrar</button>':'Não tem uma conta? <button onclick="switchAuthMode(true)">Criar conta</button>')+'</div><button class="auth-guest" onclick="closeAuthModal()">Continuar navegando sem conta →</button></section>'}
function switchAuthMode(signup){authBusy=false;authSignupMode=signup;authNotice='';renderAuthModal()}
function closeAuthModal(){$('auth-modal-root').innerHTML=''}
async function submitAuthModal(){
 if(authBusy)return;
 const email=$('cloud-email')?.value.trim(),password=$('cloud-password')?.value,signup=authSignupMode;
 const name=signup?$('cloud-name')?.value.trim():'',phone=signup?$('cloud-whatsapp')?.value.trim():'';
 const feedback=$('auth-feedback'),submit=$('auth-modal-root')?.querySelector('.auth-submit');
 if(!email||!password||password.length<8){if(feedback)feedback.textContent='Informe e-mail e senha com pelo menos 8 caracteres.';return}
 if(signup&&(!name||name.length<3||phone.replace(/\\D/g,'').length<10)){if(feedback)feedback.textContent='Informe seu nome completo e um WhatsApp válido com DDD.';return}
 authBusy=true;if(submit){submit.disabled=true;submit.textContent='Aguarde...'}if(feedback)feedback.textContent='';
 try{
  const r=signup?await cloud.auth.signUp({email,password,options:{data:{full_name:name,phone:phone}}}):await cloud.auth.signInWithPassword({email,password});
  if(r.error){
   const msg=String(r.error.message||'');
   if(/email.rate.limit.exceeded|over.email.rate.limit|email.*rate.*limit/i.test(msg)||r.error.status===429){
    if(feedback){feedback.className='auth-verify-warning';feedback.innerHTML='<strong>✉ Limite temporário de envio de e-mails</strong><span>O serviço de confirmação de e-mail atingiu seu limite de envios. Sua solicitação não foi concluída nesta tentativa. Aguarde a liberação do limite ou peça ao administrador para configurar um servidor SMTP próprio no Supabase. Não é necessário repetir o cadastro várias vezes.</span>'}
    return;
   }
   if(!signup&&(/email.not.confirmed|email.not.verified|confirm.*email|email.*confirm/i.test(msg)||r.error.code==='email_not_confirmed')){
    if(feedback){feedback.className='auth-verify-warning';feedback.innerHTML='<strong>✉ Confirme seu e-mail primeiro.</strong><span>Abra sua caixa de entrada e clique no link de confirmação. Verifique também o spam antes de tentar entrar novamente.</span>'}
    return;
   }
   throw r.error;
  }
  if(signup){
   authSignupMode=false;
   authNotice='Se o cadastro for novo, enviamos um link de confirmação para '+email+'. Confira a caixa de entrada e o spam antes de entrar. Após confirmar, aguarde a liberação do fundador.';
   if(r.data.session){await cloud.auth.signOut();cloudUser=null;cloudRole=null}
   authBusy=false;renderAuthModal();const loginButton=$('auth-modal-root')?.querySelector('.auth-submit');if(loginButton){loginButton.disabled=false;loginButton.textContent='Entrar'}return;
  }
  if(!r.data.user?.email_confirmed_at){
   await cloud.auth.signOut();cloudUser=null;cloudRole=null;
   if(feedback){feedback.className='auth-verify-warning';feedback.innerHTML='<strong>✉ Confirme seu e-mail primeiro.</strong><span>Verifique sua caixa de entrada e o spam.</span>'}
   return;
  }
  cloudUser=r.data.user;authNotice='';closeAuthModal();await loadCloud();await loadMyProfile();go('Painel');
  const displayName=(myProfile?.full_name||r.data.user.user_metadata?.full_name||r.data.user.email?.split('@')[0]||'').trim();
  showWelcomePopup(displayName);
 }catch(e){if(feedback){feedback.className='auth-error';feedback.textContent=e.message||'Não foi possível acessar sua conta.'}}
 finally{authBusy=false;const live=$('auth-modal-root')?.querySelector('.auth-submit');if(live){live.disabled=false;live.removeAttribute('disabled');live.textContent=authSignupMode?'Criar conta':'Entrar'}}
}

async function setFounderRole(id){if(cloudRole!=='founder')return;const sel=document.getElementById('founder-role-'+id),role=sel?.value;if(!role)return;const btn=document.getElementById('founder-save-'+id);if(btn){btn.disabled=true;btn.textContent='Salvando...'}const r=await cloud.rpc('iasd_founder_set_role',{target_user:id,new_role:role});if(r.error){alert('Não foi possível alterar o cargo: '+r.error.message);if(btn){btn.disabled=false;btn.textContent='Salvar cargo'}return}await loadFounderAccounts()}
async function deleteFounderUser(id){
 if(cloudRole!=='founder'||id===cloudUser?.id)return;
 const u=founderAccounts.find(x=>x.user_id===id);
 if(!u||u.role==='founder')return;
 if(!confirm('Excluir definitivamente '+(u.full_name||u.email||'esta conta')+'?\n\nO cadastro e o acesso serão removidos. Esta ação não pode ser desfeita.'))return;
 const btn=document.getElementById('founder-delete-'+id);
 if(btn){btn.disabled=true;btn.textContent='Excluindo...'}
 try{
  const {data,error}=await cloud.functions.invoke('iasd-delete-user',{body:{user_id:id}});
  if(error||!data?.success)throw new Error(data?.error||error?.message||'Não foi possível excluir.');
  await loadFounderAccounts();
 }catch(e){alert('Não foi possível excluir: '+e.message);if(btn){btn.disabled=false;btn.textContent='Excluir usuário'}}
}

async function saveFounderProfile(id){if(cloudRole!=='founder')return;const btn=$('founder-edit-save');btn.disabled=true;btn.textContent='Salvando...';const r=await cloud.rpc('iasd_founder_update_profile',{target_user:id,profile_name:$('founder-edit-name').value,profile_church:$('founder-edit-church').value,profile_ministry:$('founder-edit-ministry').value,profile_phone:$('founder-edit-phone').value,profile_position:$('founder-edit-position').value});if(r.error){$('founder-edit-feedback').textContent=r.error.message;btn.disabled=false;btn.textContent='Salvar cadastro';return}closeInlineTextEditor();await loadFounderAccounts()}
function founderDashboard(){

 const ordinary=founderAccounts.filter(u=>!u.role||u.role==='pending'||u.role==='viewer');

ção</button><button onclick="editFounderProfile(\''+u.user_id+'\')">✎ Editar cadastro</button>'+(u.role==='founder'?'':'<button id="founder-delete-'+u.user_id+'" class="founder-delete-btn" onclick="deleteFounderUser(\''+u.user_id+'\')">Excluir usuário</button>')+'</div></article>';
 return '<div class="founder-dashboard"><div class="sectionhead"><div><h2>Painel do fundador</h2><p class="muted">Permissões administrativas e funções da igreja são independentes. Usuário comum não é cargo.</p></div><button onclick="loadFounderAccounts()">↻ Atualizar</button></div><div class="founder-stats"><div><strong>'+founderAccounts.length+'</strong><small>Contas cadastradas</small></div><div><strong>'+ordinary.length+'</strong><small>Usuários comuns</small></div><div><strong>'+management.length+'</strong><small>Com cargo administrativo</small></div></div>'+(founderLoading?'<div class="panel">Carregando contas...</div>':founderError?'<div class="panel" role="alert">Erro: '+esc(founderError)+'</div>':'<div class="sectionhead"><h2>Cargos administrativos</h2></div>'+(management.length?management.map(card).join(''):'<div class="panel"><p>Nenhum cargo administrativo adicional.</p></div>')+'<div class="sectionhead"><h2>Usuários comuns</h2></div>'+ordinary.map(card).join(''))+'</div>';
}

async function saveFounderPosition(id){if(cloudRole!=='founder')return;const u=founderAccounts.find(x=>x.user_id===id);if(!u)return;const value=document.getElementById('founder-position-'+id)?.value||'';const r=await cloud.rpc('iasd_founder_update_profile',{target_user:id,profile_name:u.full_name||'',profile_church:'IASD - Caldas do Jorro',profile_ministry:u.ministry||'',profile_phone:u.phone||'',profile_position:value});if(r.error){alert('Erro ao salvar função: '+r.error.message);return}await loadFounderAccounts()}

let imageLibrary=[],imageOffset=0,imageLoading=false,imageNotice='',siteAssets={};
const IMAGE_BUCKET='iasd-images',IMAGE_PAGE_SIZE=60;
const assetSlots=[['home_banner','Banner da página inicial'],['site_logo','Logotipo do site'],['home_icon_projection','Ícone: Projeção'],['home_icon_schedule','Ícone: Cronograma'],['home_icon_bible','Ícone: Bíblia'],['home_icon_media','Ícone: Mídia'],['home_icon_more','Ícone: Mais']];
function canManageSite(){return !!cloudUser&&['founder','cofounder','admin'].includes(cloudRole)}
function imageUrl(path){return cloud.storage.from(IMAGE_BUCKET).getPublicUrl(path).data.publicUrl}
async function loadSiteBanner(){if(!cloud)return;const r=await cloud.from('iasd_site_assets').select('slot,image_path');if(!r.error){siteAssets=Object.fromEntries((r.data||[]).map(x=>[x.slot,x.image_path]));const mark=$('site-brandmark');if(mark)mark.innerHTML=siteAssets.site_logo?'<img src="'+esc(imageUrl(siteAssets.site_logo))+'" alt="" style="width:38px;height:38px;object-fit:contain">':'✦';applySiteTheme(activeSiteTheme);if(current==='Painel'||current==='Mídia')render()}}
async function loadImages(reset=true){if(!canManageSite()||imageLoading)return;imageLoading=true;if(reset){imageOffset=0;imageLibrary=[]}const r=await cloud.storage.from(IMAGE_BUCKET).list('',{limit:IMAGE_PAGE_SIZE,offset:imageOffset,sortBy:{column:'created_at',order:'desc'}});imageLoading=false;if(r.error)imageNotice='Falha ao carregar a galeria: '+r.error.message;else{imageLibrary.push(...(r.data||[]).filter(x=>x.name&&!x.name.startsWith('.')));imageOffset+=r.data?.length||0;imageNotice=''}if(current==='Acervo'||current==='Mídia')render()}
async function uploadImages(input){if(!canManageSite())return;const files=Array.from(input.files||[]);if(!files.length)return;const types={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov'};let done=0,errors=[];const progress=$('site-media-progress');for(let i=0;i<files.length;i++){const file=files[i];if(progress)progress.textContent='Enviando '+(i+1)+' de '+files.length+': '+file.name;if(!types[file.type]||file.size>50*1024*1024){errors.push(file.name+': formato inválido ou acima de 50 MB');continue}const name=file.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(0,65);const path=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2))+'-'+name;const r=await cloud.storage.from(IMAGE_BUCKET).upload(path,file,{contentType:file.type,cacheControl:'3600',upsert:false});if(r.error)errors.push(file.name+': '+r.error.message);else done++}input.value='';await loadImages();imageNotice=done+' arquivo(s) salvo(s) no banco de mídias.'+(errors.length?' Erros: '+errors.join('; '):'');render()}
async function setSiteAsset(slot,path){if(!canManageSite()||!assetSlots.some(x=>x[0]===slot))return;const r=await cloud.from('iasd_site_assets').upsert({slot,image_path:path,updated_at:new Date().toISOString()});if(r.error){alert(r.error.message);return}siteAssets[slot]=path;if(slot==='site_logo'){const mark=$('site-brandmark');if(mark)mark.innerHTML='<img src="'+esc(imageUrl(path))+'" alt="" style="width:38px;height:38px;object-fit:contain">'}imageNotice='Mídia aplicada ao site.';render()}
async function clearSiteAsset(slot){if(!canManageSite())return;const r=await cloud.from('iasd_site_assets').delete().eq('slot',slot);if(r.error){alert(r.error.message);return}delete siteAssets[slot];if(slot==='site_logo'){const mark=$('site-brandmark');if(mark)mark.textContent='✦'}render()}

let preferredProjectionScreen=null;
async function configureProjectionScreen(){
 if(typeof window.getScreenDetails!=='function'){projectionFeedback('Este navegador não permite selecionar automaticamente o segundo monitor. Abra no Chrome e clique em Configurar monitor.',true);return false}
 try{
  const details=await window.getScreenDetails(),screens=Array.from(details.screens||[]);
  const secondary=screens.find(screen=>!screen.isPrimary)||screens.find(screen=>screen!==details.currentScreen);
  if(!secondary){projectionFeedback('Segundo monitor não detectado. Verifique Spacedesk e Estender.',true);return false}
  preferredProjectionScreen=secondary;
  const p={left:secondary.availLeft??secondary.left,top:secondary.availTop??secondary.top,width:secondary.availWidth??secondary.width,height:secondary.availHeight??secondary.height};
  localStorage.setItem('iasd-projection-placement',JSON.stringify(p));
  projectionFeedback('Monitor 2 configurado! Feche o projetor atual e clique em Projetar para tentar abrir diretamente em tela cheia.');
  return true;
 }catch(e){console.warn('Monitores',e);projectionFeedback('Permita gerenciar janelas no navegador. Se não funcionar, use Chrome.',true);return false}
}
function savedProjectionPlacement(){
 try{const p=JSON.parse(localStorage.getItem('iasd-projection-placement')||'null');return p&&[p.left,p.top,p.width,p.height].every(Number.isFinite)?p:null}catch(e){return null}
}
async function positionProjectionOnSecondScreen(w){
 if(!canReachProjection())return false;
 try{
  if(typeof window.getScreenDetails!=='function'){
   projectionFeedback('Seu navegador não disponibiliza a seleção automática de monitores. Para abrir diretamente no celular, use Chrome e autorize Gerenciamento de janelas.',true);
   return false;
  }
  const details=await window.getScreenDetails();
  const screens=Array.from(details.screens||[]);
  const other=screens.find(screen=>!screen.isPrimary)||screens.find(screen=>screen!==details.currentScreen);
  if(!other){projectionFeedback('O Windows não informou um segundo monitor. Confira o Spacedesk e o modo Estender.',true);return false}
  preferredProjectionScreen=other;
  const p={left:other.availLeft??other.left,top:other.availTop??other.top,width:other.availWidth??other.width,height:other.availHeight??other.height};
  localStorage.setItem('iasd-projection-placement',JSON.stringify(p));
  if(!canReachProjection())return false;
  w.moveTo(p.left,p.top);
  w.resizeTo(p.width,p.height);
  const actualX=w.screenX,actualY=w.screenY;
  const placed=Math.abs(actualX-p.left)<120&&Math.abs(actualY-p.top)<120;
  if(!placed){
   projectionFeedback('O navegador bloqueou a movimentação para o monitor 2. No Chrome, permita Gerenciamento de janelas para este site.',true);
   return false;
  }
  projectionFeedback('Projetor posicionado automaticamente no segundo monitor.');
  return true;
 }catch(e){
  console.warn('Seleção do segundo monitor',e);
  projectionFeedback('Não foi possível acessar os monitores. Autorize Gerenciamento de janelas no Chrome e tente novamente.',true);
  return false;
 }
}

 if(canReachProjection()){sendProjection(data.stage||'');return true}
 const url=new URL('projection.html',location.href).href;
 const saved=savedProjectionPlacement();
 // Request fullscreen during the original click; delayed requests lose user activation.
 const bounds=saved?',left='+Math.round(saved.left)+',top='+Math.round(saved.top)+',width='+Math.round(saved.width)+',height='+Math.round(saved.height):',width=1100,height=700';
 const w=window.open(url,'iasd-projection','popup,fullscreen'+bounds);

  projectionFeedback('Para abrir diretamente em tela cheia no monitor 2, configure o monitor antes de projetar.');

}

function themeById(id){return SITE_THEMES.find(t=>t.id===id)||SITE_THEMES[0]}
function applySiteTheme(id){const t=themeById(id);activeSiteTheme=t.id;document.documentElement.setAttribute('data-site-theme',t.id);let el=$('iasd-theme-style');if(!el){el=document.createElement('style');el.id='iasd-theme-style';document.head.appendChild(el)}const v=(name)=>t[name];el.textContent=':root{color-scheme:'+(['celestial','esperanca','pergaminho','minimal'].includes(t.id)?'light':'dark')+';--iasd-bg:'+v('bg')+';--iasd-surface:'+v('surface')+';--iasd-ink:'+v('ink')+';--iasd-accent:'+v('accent')+'}body{background:radial-gradient(ellipse at 85% -10%,'+t.hero2+'55,transparent 52%),'+t.bg+'!important;color:'+t.ink+'!important}header h1,.tile strong,.panel h2,.panel h3,.sectionhead h2{color:'+t.ink+'!important}header h1 span,.brandmark{color:'+t.accent+'!important}header small,.muted,.panel p,.tile small{color:'+t.muted+'!important}.tile,.tile.feature,.panel,.profile-info{background:linear-gradient(155deg,'+t.surface+','+t.surface2+')!important;color:'+t.ink+'!important;border-color:'+t.border+'!important;border-radius:'+t.round+'!important}.hero{background:linear-gradient(115deg,'+t.hero+','+t.hero2+')!important;border-color:'+t.border+'!important;border-radius:'+t.round+'!important}.hero p{color:#f3f4fa!important}.tile .glyph,.tile:nth-child(odd) .glyph,.tile.feature .glyph{background:'+t.glyph+'!important;color:'+t.accent+'!important}.tile .tile-arrow{color:'+t.accent+'!important}.desktop-sidebar{background:'+t.sidebar+'!important;border-color:'+t.border+'!important}.sidebar-link.active{background:'+t.accent+'22!important;color:'+t.accent+'!important}.sidebar-link:hover{background:'+t.accent+'19!important}.bottomnav{background:'+t.nav+'!important;border-color:'+t.border+'!important}.bottomnav button{color:'+t.muted+'!important}.bottomnav button.active{color:'+t.accent+'!important;background:'+t.accent+'16!important}.account-trigger,.iconbtn,.preview-launch{background:'+t.surface+'!important;color:'+t.ink+'!important;border-color:'+t.border+'!important}.account-popover,.auth-dialog{background:'+t.surface+'!important;color:'+t.ink+'!important;border-color:'+t.border+'!important}.panel input,.panel textarea,.panel select,.image-card-actions select{background:'+t.bg+'!important;color:'+t.ink+'!important;border-color:'+t.border+'!important}.panel button.primary,.auth-submit,.image-upload{background:'+t.accent+'!important;color:'+t.accentText+'!important}.image-card{background:'+t.surface+'!important;border-color:'+t.border+'!important}.verse-card{background:linear-gradient(115deg,'+t.surface+','+t.hero2+')!important;color:'+t.ink+'!important;border-color:'+t.border+'!important}.verse-card blockquote{color:'+t.ink+'!important}.verse-card small{color:'+t.accent+'!important}.tile,.panel,button{transition:background-color .22s,border-color .22s,transform .22s,box-shadow .22s}.tile:hover{border-color:'+t.accent+'!important;transform:translateY(-3px);box-shadow:0 12px 28px #0002!important}.panel button:hover,.sidebar-link:hover{transform:translateY(-1px)}'+(t.motion==='float'?'.hero{background-size:160% 160%!important;animation:iasd-gradient 12s ease infinite}.tile:hover{transform:translateY(-5px)}':t.motion==='glow'?'.tile:hover,.panel button.primary:hover{box-shadow:0 0 23px '+t.accent+'45!important}':'')+'@keyframes iasd-gradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}@media(prefers-reduced-motion:reduce){.hero,.tile,.panel,button{animation:none!important;transition:none!important;transform:none!important}}';}
async function loadActiveTheme(){if(!cloud)return;const r=await cloud.from('iasd_site_theme').select('theme_id,layout_id').eq('id',1).maybeSingle();if(!r.error&&r.data){applySiteTheme(r.data.theme_id);applyLayout(r.data.layout_id||'layout-01');selectedSiteTheme=activeSiteTheme;if(new URLSearchParams(location.search).has('preview')&&window.__previewTheme)applySiteTheme(window.__previewTheme)}}

ser"><div class="theme-chooser-heading"><strong>50 temas</strong><small>Alterações apenas na prévia até salvar.</small></div><input class="theme-search" type="search" placeholder="Buscar entre os 50 temas..." value="'+esc(themeSearch)+'" oninput="filterSiteThemes(this.value)"><div id="theme-choice-list" class="theme-choices">'+cards+'</div><div class="theme-publish"><button id="theme-save-btn" onclick="saveSiteTheme()" '+(selectedSiteTheme===activeSiteTheme?'disabled':'')+'>✓ Salvar e publicar tema</button><p id="theme-save-status" role="status">'+(selectedSiteTheme===activeSiteTheme?'Este tema já está publicado.':'Prévia não publicada.')+'</p></div></aside><div class="preview-viewport"><div class="preview-frame-shell" style="width:'+(w*scale)+'px;height:'+(h*scale)+'px"><iframe id="device-preview-frame" title="Prévia IASD Studio" style="width:'+w+'px;height:'+h+'px;transform:scale('+scale+');transform-origin:top left" src="'+location.pathname+'?preview=1"></iframe></div></div></div><div class="preview-footnote">'+w+' × '+h+' px · Prévia aproximada · Animações respeitam a preferência de movimento reduzido.</div></section>';const frame=$('device-preview-frame');frame.addEventListener('load',()=>{frame.contentWindow.postMessage({type:'IASD_THEME_PREVIEW',themeId:selectedSiteTheme},location.origin)})}

function drawCover(){if(!coverSlotEditing)return;const slot=coverSlotEditing;const isQuick=slot!=='home_banner'&&slot!=='site_logo';const media=coverPath?(isQuick?'<img class="quick-backdrop" src="'+esc(imageUrl(coverPath))+'" alt="" aria-hidden="true"><img id="cover-img" class="quick-foreground" src="'+esc(imageUrl(coverPath))+'" style="'+quickFrameStyle(frameX,frameY,frameZoom)+'" alt="Prévia">':'<img id="cover-img" src="'+esc(imageUrl(coverPath))+'" style="'+coverImageStyle(frameX,frameY,frameZoom)+'" alt="Prévia">'):'<span>Escolha ou importe uma imagem.</span>';$('inline-editor-root').innerHTML='<div class="iasd-edit-backdrop" onclick="closeCover()"></div><section class="cover-dialog" role="dialog" aria-modal="true"><header class="cover-head"><strong>✎ '+(slot==='home_banner'?'Banner da página inicial':slot==='site_logo'?'Logotipo':'Capa do acesso rápido')+'</strong><button onclick="closeCover()">✕</button></header><div class="cover-body"><div><div class="cover-preview '+(slot==='home_banner'?'wide':slot==='site_logo'?'logo':'portrait')+'">'+media+'</div><p>Arraste a imagem ou use os controles para enquadrar.</p><label>Zoom <input type="range" min="1" max="3" step=".05" value="'+frameZoom+'" oninput="coverFrame(\'z\',this.value)"></label><label>Horizontal <input type="range" min="0" max="100" value="'+frameX+'" oninput="coverFrame(\'x\',this.value)"></label><label>Vertical <input type="range" min="0" max="100" value="'+frameY+'" oninput="coverFrame(\'y\',this.value)"></label><button onclick="frameX=50;frameY=50;frameZoom=1;updateCover()">Centralizar</button></div><div><div class="cover-gallery-head"><h3>Galeria do site</h3><label>＋ Importar imagem<input type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden onchange="importCover(this)"></label></div><div id="cover-gallery" class="cover-gallery">Carregando...</div></div></div><footer class="cover-footer"><span id="cover-status"></span><button onclick="closeCover()">Cancelar</button>'+(siteAssets[slot]?'<button onclick="removeCover()">Remover imagem</button>':'')+'<button class="primary" onclick="saveCover()">Salvar e publicar</button></footer></section>';const el=$('inline-editor-root').querySelector('.cover-preview');let drag=false,x,y,fx,fy;el.onpointerdown=e=>{if(!coverPath)return;drag=true;x=e.clientX;y=e.clientY;fx=frameX;fy=frameY;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!drag)return;frameX=Math.max(0,Math.min(100,fx+(x-e.clientX)/el.clientWidth*100));frameY=Math.max(0,Math.min(100,fy+(y-e.clientY)/el.clientHeight*100));updateCover()};el.onpointerup=()=>drag=false;el.onpointercancel=()=>drag=false}

async function loadCoverGallery(){
 const slot=coverSlotEditing;if(!slot)return;
 const gallery=$('cover-gallery');if(!gallery)return;
 gallery.textContent='Carregando imagens da biblioteca...';
 try{
  // A biblioteca administrativa e o editor consultam os mesmos arquivos do Storage.
  // A RPC evita respostas vazias do endpoint de listagem do Storage.
  const result=await cloud.rpc('iasd_list_site_images');
  if(result.error)throw result.error;
  const all=(result.data||[]).map(x=>x.name).filter(Boolean);
  const el=$('cover-gallery');if(!el||coverSlotEditing!==slot)return;
  el.innerHTML=all.length?all.map(path=>'<button class="'+(coverPath===path?'selected':'')+'" onclick="chooseCover('+JSON.stringify(path).replace(/"/g,'&quot;')+')"><img loading="lazy" src="'+esc(imageUrl(path))+'" alt="'+esc(path)+'"></button>').join(''):'Nenhuma imagem encontrada na biblioteca do site.';
 }catch(e){
  const el=$('cover-gallery');if(el&&coverSlotEditing===slot)el.textContent='Não foi possível carregar a biblioteca: '+(e.message||String(e));
 }
}

function applyInlineEditors(){const root=$('content');if(!root)return;
 const eligiblePages=['Painel','Projeção','Sorteadores','Mais','Mídia'];if(!eligiblePages.includes(current))return;
 const targets=[];
 if(current==='Painel'){
  targets.push(...[['.hero .eyebrow','Boas-vindas'],['.hero h2','Título principal'],['.hero p','Descrição principal'],['.verse-card blockquote','Versículo em destaque'],['.verse-card small','Referência bíblica']].map(([selector,label],i)=>({el:root.querySelector(selector),key:'home_static_'+i,label})));
  root.querySelectorAll('.tile').forEach((tile,i)=>{targets.push({el:tile.querySelector('strong'),key:'home_tile_'+i+'_title',label:'Nome do cartão'});targets.push({el:tile.querySelector('small'),key:'home_tile_'+i+'_desc',label:'Descrição do cartão'})});
 }else if(current==='Projeção'){
  root.querySelectorAll('.sectionhead h2,.panel h2,.panel>p.muted').forEach((el,i)=>targets.push({el,key:'projection_'+i,label:'Texto da projeção'}));
 }else if(current==='Sorteadores'){
  root.querySelectorAll('.panel h2,.panel h3').forEach((el,i)=>targets.push({el,key:'draw_'+i,label:'Título da ferramenta'}));
 }else if(current==='Mais'){
  root.querySelectorAll('.sectionhead h2,.grid .tile strong,.grid .tile small').forEach((el,i)=>targets.push({el,key:'more_'+i,label:'Texto da ferramenta'}));
 }else if(current==='Mídia'){

 }
 for(const item of targets){if(!item.el)continue;const {el,key,label}=item;if(!el.dataset.iasdDefault)el.dataset.iasdDefault=el.textContent.trim();if(Object.prototype.hasOwnProperty.call(siteTextOverrides,key))el.textContent=siteTextOverrides[key];if(!contentEditAllowed())continue;el.classList.add('iasd-editable-text');const btn=document.createElement('button');btn.className='iasd-pencil';btn.type='button';btn.textContent='✎';btn.title='Editar '+label;btn.setAttribute('aria-label','Editar '+label);btn.onclick=e=>{e.stopPropagation();e.preventDefault();openInlineTextEditor(key,label,el.dataset.iasdDefault,el.textContent.replace('✎','').trim())};el.appendChild(btn)}

// Preferência visual individual, independente do login.
function applyTheme(mode){
 const dark=mode==='dark';
 document.documentElement.setAttribute('data-theme',dark?'dark':'light');
 const btn=document.getElementById('theme-toggle');
 const icon=document.getElementById('theme-icon');
 const label=document.getElementById('theme-label');
 if(icon)icon.textContent=dark?'☀':'☾';
 if(label)label.textContent=dark?'Claro':'Escuro';
 if(btn){btn.setAttribute('aria-label',dark?'Ativar modo claro':'Ativar modo escuro');btn.title=dark?'Ativar modo claro':'Ativar modo escuro';btn.setAttribute('aria-pressed',String(dark))}
}
function toggleTheme(){
 const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
 try{localStorage.setItem('iasd-app-theme',next)}catch(e){}
 applyTheme(next);

async function fetchBibleChapter(book,chapter){
 const key=book+'|'+chapter;
 if(bibleChapterCache.has(key))return bibleChapterCache.get(key);
 const url='https://bible-api.com/'+encodeURIComponent(book+' '+chapter)+'?translation=almeida&single_chapter_book_matching=indifferent';
 const promise=(async()=>{
  const response=await fetch(url);
  if(!response.ok)throw Error('Consulta indisponível ('+response.status+')');
  const result=await response.json();
  if(!Array.isArray(result.verses)||!result.verses.length)throw Error('Capítulo não encontrado');
  const verses=result.verses.filter(v=>Number(v.chapter)===Number(chapter)&&typeof v.text==='string');
  if(!verses.length)throw Error('Capítulo não encontrado na tradução');
  return verses;
 })();
 bibleChapterCache.set(key,promise);
 try{return await promise}catch(e){bibleChapterCache.delete(key);throw e}
}
async function updateBibleVerses(){

  const verses=await fetchBibleChapter(book,chapter);
  if(serial!==bibleRequestSerial||!$('bbook')||book!==$('bbook').value||chapter!==Number($('bchapter').value))return;
  sel.innerHTML='<option value="">Selecione o versículo</option>'+verses.map(v=>'<option value="'+v.verse+'">'+v.verse+'</option>').join('');
  if(verses.some(v=>String(v.verse)===old))sel.value=old;
 }catch(e){
  if(serial!==bibleRequestSerial)return;
  sel.innerHTML='<option value="">Consulta indisponível — digite abaixo</option>';
  const out=$('bresult');if(out)out.textContent='Não foi possível carregar a lista agora. Você ainda pode digitar o versículo e tentar buscar.';
 }
}
async function searchBible(){
 const book=$('bbook'),chapter=Number($('bchapter').value||$('bchapterSelect').value),v=($('bverse').value||$('bverseSelect').value).trim(),out=$('bresult');
 if(!Number.isInteger(chapter)||chapter<1||chapter>(bibleChapterCounts[book.selectedIndex]||150)||!/^\d{1,3}(?:-\d{1,3})?$/.test(v)){out.textContent='Informe um capítulo e versículo válidos.';return}

 if(start<1||(end!==undefined&&(end<start||end-start>30))){out.textContent='Escolha um intervalo de até 31 versículos.';return}
 const ref=book.options[book.selectedIndex].text+' '+chapter+':'+v;
 out.textContent='Buscando '+ref+'…';
 try{
  const verses=await fetchBibleChapter(book.value,chapter);
  const chosen=verses.filter(x=>x.verse>=start&&x.verse<=(end||start));
  if(!chosen.length||chosen[0].verse!==start||(end!==undefined&&chosen[chosen.length-1].verse!==end))throw Error('Versículo não disponível nesta tradução');
  const text=chosen.map(x=>x.text.trim()).join(' ').replace(/\s+/g,' ').trim();
  bibleResult={ref,text};
  out.innerHTML='<div class="bible-result"><span class="bible-result-eyebrow">PASSAGEM ENCONTRADA</span><h3>'+esc(ref)+'</h3><p>'+esc(text)+'</p><button class="primary" onclick="projectBible()" '+(canUseSound()?'':'disabled title="Exclusivo para sonoplastas"')+'>▶ Projetar na televisão</button></div>';
 }catch(e){bibleResult=null;out.innerHTML='<div class="bible-error">Não foi possível carregar '+esc(ref)+'. '+esc(e.message||'Verifique sua conexão e tente novamente.')+' <button onclick="searchBible()">Tentar novamente</button></div>'}
}
