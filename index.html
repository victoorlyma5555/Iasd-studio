async function sendFounderSoundAlert(){if(!hasAssignedRole())return alert('Esta função é exclusiva para membros que possuem cargo.');const field=document.getElementById('founder-sound-alert'),message=field?.value.trim();if(!message||message.length>500)return alert('Escreva uma mensagem de até 500 caracteres.');const schedule=document.getElementById('founder-alert-schedule')?.value||'',btn=document.getElementById('founder-send-alert');if(btn)btn.disabled=true;try{const result=await cloud.from('iasd_sound_alerts').insert({created_by:cloudUser.id,sender_name:loggedUserName(),message,schedule_name:schedule||null});if(result.error)throw result.error;field.value='';alert('Alerta enviado. O sonoplasta receberá o aviso em tempo real se estiver conectado ao site e ao aplicativo Windows.')}catch(e){alert('Não foi possível enviar: '+e.message)}finally{if(btn)btn.disabled=false}}
async function deliverSoundAlert(item){if(!item?.id||soundAlertSeen.has(item.id)||!cloudUser||!canUseSound()||!companionToken)return; if(soundAlertPending.has(item.id))return soundAlertPending.get(item.id);const job=(async()=>{try{await companionRequest('/alert',item);soundAlertSeen.add(item.id)}catch(e){console.warn('Alerta aguardando conexão com o aplicativo:',e.message)}})().finally(()=>soundAlertPending.delete(item.id));soundAlertPending.set(item.id,job);return job}
async function soundAlertsPoll(){if(!cloud||!cloudUser||!canUseSound()||!companionToken||soundAlertBusy)return;soundAlertBusy=true;try{const result=await cloud.from('iasd_sound_alerts').select('id,message,sender_name,schedule_name,created_at').order('created_at',{ascending:false}).limit(20);if(result.error)throw result.error;const alerts=(result.data||[]).reverse();if(!soundAlertsInitialized){for(const item of alerts)soundAlertSeen.add(item.id);soundAlertsInitialized=true;return}for(const item of alerts)await deliverSoundAlert(item)}catch(e){console.warn('Falha ao consultar alertas:',e.message)}finally{soundAlertBusy=false}}
function setupSoundAlertsRealtime(){const user=cloudUser?.id||null;if(soundAlertChannel&&soundAlertChannelUser===user)return;if(soundAlertChannel){cloud.removeChannel(soundAlertChannel);soundAlertChannel=null}soundAlertChannelUser=user;soundAlertSeen.clear();soundAlertsInitialized=false;if(!cloud||!user||!canUseSound())return;
 // Inicializar histórico antes de assinar para não repetir alertas antigos.
 void soundAlertsPoll().finally(()=>{if(soundAlertChannelUser!==user||!cloudUser||!canUseSound())return;
 soundAlertChannel=cloud.channel('iasd-sound-alerts-'+user).on('postgres_changes',{event:'INSERT',schema:'public',table:'iasd_sound_alerts'},payload=>{void deliverSoundAlert(payload.new)}).subscribe(status=>{if(status==='SUBSCRIBED')void soundAlertsPoll();if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')console.warn('Alertas em tempo real: reconectando; consulta de reserva permanece ativa.')});
 })}

async function signInWithGoogle(){
 if(!cloud||authBusy)return;
 authBusy=true;
 const feedback=$('auth-feedback');
 try{
  const redirectTo=window.location.origin+window.location.pathname;
  const {error}=await cloud.auth.signInWithOAuth({provider:'google',options:{redirectTo,queryParams:{access_type:'offline',prompt:'consent'}}});

 }catch(e){authBusy=false;if(feedback){feedback.className='auth-error';feedback.textContent=e.message||'Não foi possível entrar com o Google.'}}

async function submitAuthModal(){
 if(authBusy)return;
 const email=$('cloud-email')?.value.trim(),password=$('cloud-password')?.value,signup=authSignupMode;
 const name='',phone='';
 const feedback=$('auth-feedback'),submit=$('auth-modal-root')?.querySelector('.auth-submit');
 if(!email||!password||password.length<8){if(feedback)feedback.textContent='Informe e-mail e senha com pelo menos 8 caracteres.';return}
 authBusy=true;if(submit){submit.disabled=true;submit.textContent='Aguarde...'}if(feedback)feedback.textContent='';
 try{
  const r=signup?await cloud.auth.signUp({email,password}):await cloud.auth.signInWithPassword({email,password});
  if(r.error){
   const msg=String(r.error.message||'');
   if(/email.rate.limit.exceeded|over.email.rate.limit|email.*rate.*limit/i.test(msg)||r.error.status===429){
    if(feedback){feedback.className='auth-verify-warning';feedback.innerHTML='<strong>✉ Limite temporário de envio de e-mails</strong><span>O serviço de confirmação de e-mail atingiu seu limite de envios. Sua solicitação não foi concluída nesta tentativa. Aguarde a liberação do limite ou peça ao administrador para configurar um servidor SMTP próprio no Supabase. Não é necessário repetir o cadastro várias vezes.</span>'}
    return;
   }
   if(!signup&&(/email.not.confirmed|email.not.verified|confirm.*email|email.*confirm/i.test(msg)||r.error.code==='email_not_confirmed')){
    if(feedback){feedback.className='auth-verify-warning';feedback.innerHTML='<strong>✉ Confirme seu e-mail primeiro.</strong><span>Abra sua caixa de entrada e clique no link de confirmação. Verifique também o spam antes de tentar entrar novamente.</span>'}
    return;
   }
   throw r.error;
  }
  if(signup){
   authSignupMode=false;
   authNotice='Se o cadastro for novo, enviamos um link de confirmação para '+email+'. Confira a caixa de entrada e o spam antes de entrar. Após confirmar, aguarde a liberação do fundador.';
   if(r.data.session){await cloud.auth.signOut();cloudUser=null;cloudRole=null}
   authBusy=false;renderAuthModal();const loginButton=$('auth-modal-root')?.querySelector('.auth-submit');if(loginButton){loginButton.disabled=false;loginButton.textContent='Entrar'}return;
  }
  if(!r.data.user?.email_confirmed_at){
   await cloud.auth.signOut();cloudUser=null;cloudRole=null;
   if(feedback){feedback.className='auth-verify-warning';feedback.innerHTML='<strong>✉ Confirme seu e-mail primeiro.</strong><span>Verifique sua caixa de entrada e o spam.</span>'}
   return;
  }
  cloudUser=r.data.user;authNotice='';closeAuthModal();await loadCloud();await loadMyProfile();go('Painel');
  const displayName=(myProfile?.full_name||r.data.user.user_metadata?.full_name||r.data.user.email?.split('@')[0]||'').trim();
  showWelcomePopup(displayName);
 }catch(e){if(feedback){feedback.className='auth-error';feedback.textContent=e.message||'Não foi possível acessar sua conta.'}}
 finally{authBusy=false;const live=$('auth-modal-root')?.querySelector('.auth-submit');if(live){live.disabled=false;live.removeAttribute('disabled');live.textContent=authSignupMode?'Criar conta':'Entrar'}}
}

let pendingUnverifiedProjection=null;
async function checkProjectionMonitor(){
 if(typeof window.getScreenDetails==='function'){
  try{const details=await window.getScreenDetails(),screens=Array.from(details.screens||[]);const secondary=screens.some(x=>!x.isPrimary)||screens.length>1;
   if(!secondary){projectionMonitorPopup('O navegador detectou apenas uma tela. O Windows pode estar em Somente tela do PC ou Duplicar, ou o telão pode estar desconectado.');return false}
   return true;
  }catch(e){console.warn('Verificação de telas indisponível',e)}
 }
 if(window.screen?.isExtended===false){projectionMonitorPopup('O navegador informa que a área de trabalho não está estendida. Confira a conexão do telão e selecione Estender no Windows.');return false}
 return null;
}
async function guardedProjection(action){
 // Quando o IASD Projetor está pareado, é o aplicativo Windows que controla o monitor.
 // O navegador não deve bloquear a projeção com base em getScreenDetails/screen.isExtended.
 if(companionToken){
  try{await companionRequest('/open');await action();return}
  catch(e){projectionFeedback('IASD Projetor: '+e.message,true);projectionMonitorPopup('O IASD Projetor está pareado, mas o aplicativo não respondeu. Confirme que ele está aberto no Windows e tente novamente.');return}
 }
 const monitor=await checkProjectionMonitor();
 if(monitor===false)return;
 if(monitor===null){pendingUnverifiedProjection=action;projectionMonitorPopup('Não foi possível verificar os monitores automaticamente. Autorize o gerenciamento de janelas no Chrome para detectar o telão ou confira o modo Estender antes de continuar.',true);return}
 await action();
}

let preferredProjectionScreen=null;
async function configureProjectionScreen(){
 if(typeof window.getScreenDetails!=='function'){projectionFeedback('Este navegador não permite selecionar automaticamente o segundo monitor. Abra no Chrome e clique em Configurar monitor.',true);return false}
 try{
  const details=await window.getScreenDetails(),screens=Array.from(details.screens||[]);
  const secondary=screens.find(screen=>!screen.isPrimary)||screens.find(screen=>screen!==details.currentScreen);
  if(!secondary){projectionFeedback('Segundo monitor não detectado. Verifique Spacedesk e Estender.',true);return false}
  preferredProjectionScreen=secondary;
  const p={left:secondary.availLeft??secondary.left,top:secondary.availTop??secondary.top,width:secondary.availWidth??secondary.width,height:secondary.availHeight??secondary.height};
  localStorage.setItem('iasd-projection-placement',JSON.stringify(p));
  projectionFeedback('Monitor 2 configurado! Feche o projetor atual e clique em Projetar para tentar abrir diretamente em tela cheia.');
  return true;
 }catch(e){console.warn('Monitores',e);projectionFeedback('Permita gerenciar janelas no navegador. Se não funcionar, use Chrome.',true);return false}
}
function savedProjectionPlacement(){

}
async function positionProjectionOnSecondScreen(w){
 if(!canReachProjection())return false;
 try{
  if(typeof window.getScreenDetails!=='function'){
   projectionFeedback('Seu navegador não disponibiliza a seleção automática de monitores. Para abrir diretamente no celular, use Chrome e autorize Gerenciamento de janelas.',true);
   return false;
  }
  const details=await window.getScreenDetails();
  const screens=Array.from(details.screens||[]);
  const other=screens.find(screen=>!screen.isPrimary)||screens.find(screen=>screen!==details.currentScreen);
  if(!other){projectionFeedback('O Windows não informou um segundo monitor. Confira o Spacedesk e o modo Estender.',true);return false}
  preferredProjectionScreen=other;
  const p={left:other.availLeft??other.left,top:other.availTop??other.top,width:other.availWidth??other.width,height:other.availHeight??other.height};
  localStorage.setItem('iasd-projection-placement',JSON.stringify(p));
  if(!canReachProjection())return false;
  w.moveTo(p.left,p.top);
  w.resizeTo(p.width,p.height);
  const actualX=w.screenX,actualY=w.screenY;
  const placed=Math.abs(actualX-p.left)<120&&Math.abs(actualY-p.top)<120;
  if(!placed){
   projectionFeedback('O navegador bloqueou a movimentação para o monitor 2. No Chrome, permita Gerenciamento de janelas para este site.',true);
   return false;
  }
  projectionFeedback('Projetor posicionado automaticamente no segundo monitor.');
  return true;
 }catch(e){
  console.warn('Seleção do segundo monitor',e);
  projectionFeedback('Não foi possível acessar os monitores. Autorize Gerenciamento de janelas no Chrome e tente novamente.',true);
  return false;
 }
}

function itemList(key){return '<ul>'+data[key].map((x,i)=>'<li>'+esc(x)+' <button onclick="removeItem(\''+key+'\','+i+')">Excluir</button> <button onclick="project('+JSON.stringify(x).replace(/"/g,'&quot;')+')">Projetar</button></li>').join('')+'</ul>'}function removeItem(key,i){data[key].splice(i,1);save()}function addItem(key){const el=$('new-'+key);if(el.value.trim()){data[key].push(el.value.trim());save()}}function parseSchedule(x){const parts=String(x).split(/\s+[—–-]\s+/);return {time:/^\d{1,2}:\d{2}$/.test(parts[0]||'')?parts.shift():'•',title:parts.shift()||String(x),person:parts.join(' — ')}}function scheduleList(items,editable=false){return items.length?items.map((x,i)=>{const a=parseSchedule(x);return '<div class="schedule"><span class="time">'+esc(a.time)+'</span><div class="event"><strong>'+esc(a.title)+'</strong>'+(a.person?'<small>'+esc(a.person)+'</small>':'')+(editable?'<div class="itemactions"><button onclick="project(cloudSchedules.find(g=>g.id===selectedSchedule).items['+i+'])">Projetar</button><button onclick="removeScheduleLine('+i+')">Excluir atividade</button></div>':'')+'</div></div>'}).join(''):'<p class="muted">Nenhuma atividade cadastrada.</p>'}function section(key,title,placeholder){return '<div class="panel"><h2>'+title+'</h2><input id="new-'+key+'" placeholder="'+placeholder+'"><button onclick="addItem(\''+key+'\')">Adicionar</button>'+itemList(key)+'</div>'}
let selectedSchedule=null,editingSchedule=null;
function scheduleId(){return 'culto-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)}
function ensureSchedules(){if(!Array.isArray(data.cronogramas))data.cronogramas=[];if(data.cronograma?.length){data.cronogramas.unshift({id:scheduleId(),name:'Cronograma anterior',date:'',items:[...data.cronograma]});data.cronograma=[];localStorage.setItem('iasd-studio',JSON.stringify(data))}if(!selectedSchedule&&cloudSchedules.length)selectedSchedule=cloudSchedules[0].id}
function showSchedule(id){selectedSchedule=id;editingSchedule=null;render()}
function newSchedule(){if(!canEditSchedule()){go('Mais');return}editingSchedule='new';render()}
function editSchedule(id){if(!canEditSchedule())return;editingSchedule=id;selectedSchedule=id;render()}
function cancelSchedule(){editingSchedule=null;render()}
let scheduleSaving=false;
function scheduleFeedback(message,error=true){const el=$('schedule-feedback');if(el){el.textContent=message;el.style.color=error?'#ad3441':'#227a54';el.style.display='block'}else alert(message)}
async function saveSchedule(){
 if(scheduleSaving)return;
 if(!canEditSchedule()){scheduleFeedback('Sua sessão expirou ou sua conta ainda não tem permissão. Entre novamente.');return}
 const name=$('schedule-name')?.value.trim(),date=$('schedule-date')?.value||null;
 const items=($('schedule-lines')?.value||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(!name){scheduleFeedback('Informe o nome do culto para salvar.');$('schedule-name')?.focus();return}
 localStorage.setItem('iasd-schedule-draft',JSON.stringify({name,date,items}));scheduleFeedback('Conectando ao Supabase...',false);scheduleSaving=true;const btn=$('save-schedule-btn');if(btn){btn.disabled=true;btn.textContent='Salvando...'}
 try{
  const payload={name,service_date:date,items};
  const result=editingSchedule==='new'
   ?await cloud.from('iasd_schedules').insert({...payload,created_by:cloudUser.id}).select().single()
   :await cloud.from('iasd_schedules').update(payload).eq('id',editingSchedule).select().single();
  if(result.error)throw result.error;if(!result.data?.id)throw Error('O banco não confirmou o cadastro');
  const savedId=result.data.id;localStorage.removeItem('iasd-schedule-draft');editingSchedule=null;
  await loadCloud();selectedSchedule=savedId;render();
 }catch(err){scheduleFeedback('Não foi possível salvar no Supabase: '+(err?.message||'erro de conexão')+'. Seus dados permanecem neste formulário.');}
 finally{scheduleSaving=false;const button=$('save-schedule-btn');if(button){button.disabled=false;button.textContent='✓ Salvar cronograma'}}
}
async function deleteSchedule(id){const g=cloudSchedules.find(x=>x.id===id);if(!canDeleteSchedule()){alert('Apenas o fundador ou um administrador pode excluir cronogramas.');return}if(!g||!confirm('Excluir todo o cronograma "'+g.name+'"? Esta ação não pode ser desfeita.'))return;const r=await cloud.from('iasd_schedules').delete().eq('id',id);if(r.error){alert('Erro ao excluir: '+r.error.message);return}await loadCloud()}
async function removeScheduleLine(i){const g=cloudSchedules.find(x=>x.id===selectedSchedule);if(!canEditSchedule()){alert('Entre com uma conta de editor ou administrador.');return}if(!g||!confirm('Excluir esta atividade?'))return;const items=g.items.filter((_,j)=>j!==i);const r=await cloud.from('iasd_schedules').update({items}).eq('id',g.id);if(r.error){alert(r.error.message);return}await loadCloud();selectedSchedule=g.id;render()}

bel><textarea id="schedule-lines" rows="9" placeholder="09:00 — Abertura — Ana Paula&#10;09:15 — Louvor — Equipe de música">'+esc(g.items.join('\n'))+'</textarea><div class="actions"><button id="save-schedule-btn" class="primary" onclick="saveSchedule()">✓ Salvar cronograma</button><button onclick="cancelSchedule()">Cancelar</button></div><p id="schedule-feedback" role="alert" style="display:none;margin-top:12px;font-weight:650"></p></div>';return html}if(group){html+='<div class="panel"><div class="sectionhead" style="margin:0 0 14px"><div><h2>'+esc(group.name)+'</h2>'+(group.date?'<p class="muted">'+esc(group.date.split('-').reverse().join('/'))+'</p>':'')+'</div></div><div class="actions">'+(canEditSchedule()?'<button class="primary" onclick="editSchedule(\''+group.id+'\')">✎ Editar</button>':'')+(canDeleteSchedule()?'<button class="danger-btn" onclick="deleteSchedule(\''+group.id+'\')">Excluir cronograma</button>':'')+'</div><div class="sectionhead"><h2>Programação</h2><span class="muted">'+group.items.length+' atividades</span></div>'+scheduleList(group.items,canEditSchedule())+'</div>'}else html+='<div class="panel"><h2>Nenhum cronograma ainda</h2><p class="muted">Toque em + Novo para cadastrar o primeiro culto.</p></div>';return html}

let themeSearch='';let activeSiteTheme='grafite',selectedSiteTheme='grafite',previewDevice='desktop',previewLandscape=false,themeSaving=false;
function themeById(id){return SITE_THEMES.find(t=>t.id===id)||SITE_THEMES[0]}
function applySiteTheme(id){
 activeSiteTheme=id||activeSiteTheme||'grafite';
 document.documentElement.removeAttribute('data-site-theme');
 const el=$('iasd-theme-style');if(el)el.textContent='';
}
async function loadActiveTheme(){
 if(!cloud)return;
 const r=await cloud.from('iasd_site_theme').select('theme_id,layout_id').eq('id',1).maybeSingle();
 if(!r.error&&r.data){activeSiteTheme=r.data.theme_id||'grafite';selectedSiteTheme=activeSiteTheme;activeLayout='layout-01';selectedLayout='layout-01'}
 document.documentElement.removeAttribute('data-layout-structure');
 document.documentElement.removeAttribute('data-layout-variant');
 document.documentElement.removeAttribute('data-site-theme');
 const el=$('iasd-theme-style');if(el)el.textContent='';
}
window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='IASD_THEME_PREVIEW')return;if(!new URLSearchParams(location.search).has('preview'))return;window.__previewTheme=e.data.themeId;applySiteTheme(e.data.themeId)});
function openDevicePreview(){if(cloudRole!=='founder')return;previewDevice=layoutDevice||'desktop';previewLandscape=false;selectedSiteTheme=activeSiteTheme;drawDevicePreview()}
function closeDevicePreview(){const root=$('device-preview-root');if(root)root.innerHTML='';document.body.classList.remove('preview-open')}
function selectPreviewDevice(device){previewDevice=device;drawDevicePreview()}
function rotateDevicePreview(){previewLandscape=!previewLandscape;drawDevicePreview()}
function selectSiteTheme(id){
 selectedSiteTheme=themeById(id).id;
 document.querySelectorAll('.theme-choice').forEach(b=>b.classList.toggle('selected',b.getAttribute('onclick')?.includes("'"+selectedSiteTheme+"'")));
 const btn=$('theme-save-btn');if(btn)btn.disabled=selectedSiteTheme===activeSiteTheme;
 const status=$('theme-save-status');if(status)status.textContent=selectedSiteTheme===activeSiteTheme?'Este tema já está publicado.':'Prévia não publicada.';
 const frame=$('device-preview-frame');
 if(frame?.contentWindow)frame.contentWindow.postMessage({type:'IASD_THEME_PREVIEW',themeId:selectedSiteTheme},location.origin);
}
function filterSiteThemes(value){themeSearch=value;const list=$('theme-choice-list');if(!list)return;list.querySelectorAll('.theme-choice').forEach(el=>{el.style.display=(el.textContent||'').toLowerCase().includes(value.toLowerCase())?'':'none'})}
async function saveSiteTheme(){if(cloudRole!=='founder'||themeSaving)return;themeSaving=true;const btn=$('theme-save-btn');if(btn){btn.disabled=true;btn.textContent='Salvando...'}const r=await cloud.from('iasd_site_theme').upsert({id:1,theme_id:selectedSiteTheme,updated_at:new Date().toISOString(),updated_by:cloudUser.id}).select().single();themeSaving=false;if(r.error){alert('Não foi possível salvar o tema: '+r.error.message);drawDevicePreview();return}applySiteTheme(r.data.theme_id);drawDevicePreview();const status=$('theme-save-status');if(status)status.textContent='✓ Tema publicado para todos os visitantes.'}
function drawDevicePreview(){if(cloudRole!=='founder')return;document.body.classList.add('preview-open');const dimensions={desktop:[1440,900],tablet:previewLandscape?[1024,768]:[768,1024],mobile:previewLandscape?[844,390]:[390,844]};const [w,h]=dimensions[previewDevice];const scale=Math.min(1,Math.max(250,innerWidth-380)/w,Math.max(200,innerHeight-200)/h);const root=$('device-preview-root');const cards=SITE_THEMES.filter(t=>!themeSearch||((t.name+' '+t.desc).toLowerCase().includes(themeSearch.toLowerCase()))).map(t=>'<button class="theme-choice '+(selectedSiteTheme===t.id?'selected':'')+'" onclick="selectSiteTheme(\''+t.id+'\')"><span class="theme-swatch" style="background:linear-gradient(135deg,'+t.bg+','+t.hero2+')"><i style="background:'+t.surface+'"></i><i style="background:'+t.accent+'"></i></span><span class="theme-name">'+t.name+'</span><small>'+t.desc+'</small>'+(activeSiteTheme===t.id?'<em>Publicado</em>':'')+'</button>').join('');root.innerHTML='<div class="device-preview-backdrop" onclick="closeDevicePreview()"></div><section class="device-preview-dialog theme-preview-dialog" role="dialog" aria-modal="true" aria-label="Prévia e temas do site"><div class="device-preview-toolbar"><div class="preview-heading"><strong>Estúdio de aparência</strong><small>Temas, layouts e visualização responsiva no mesmo lugar.</small><span class="studio-switch"><button class="selected" type="button">◈ Temas e dispositivos</button><button onclick="openLayoutStudio()">▦ 50 layouts</button></span></div><div class="device-switch">'+[['desktop','▣ PC'],['tablet','▯ Tablet'],['mobile','▯ Celular']].map(([d,n])=>'<button class="'+(previewDevice===d?'selected':'')+'" onclick="selectPreviewDevice(\''+d+'\')">'+n+'</button>').join('')+'</div><div class="preview-controls"><button onclick="rotateDevicePreview()" '+(previewDevice==='desktop'?'disabled':'')+'>↻ Girar</button><button onclick="closeDevicePreview()">✕</button></div></div><div class="theme-preview-body"><aside class="theme-chooser"><div class="theme-chooser-heading"><strong>50 temas</strong><small>Alterações apenas na prévia até salvar.</small></div><input class="theme-search" type="search" placeholder="Buscar entre os 50 temas..." value="'+esc(themeSearch)+'" oninput="filterSiteThemes(this.value)"><div id="theme-choice-list" class="theme-choices">'+cards+'</div><div class="theme-publish"><button id="theme-save-btn" onclick="saveSiteTheme()" '+(selectedSiteTheme===activeSiteTheme?'disabled':'')+'>✓ Salvar e publicar tema</button><p id="theme-save-status" role="status">'+(selectedSiteTheme===activeSiteTheme?'Este tema já está publicado.':'Prévia não publicada.')+'</p></div></aside><div class="preview-viewport"><div class="preview-frame-shell" style="width:'+(w*scale)+'px;height:'+(h*scale)+'px"><iframe id="device-preview-frame" title="Prévia IASD APP" style="width:'+w+'px;height:'+h+'px;transform:scale('+scale+');transform-origin:top left" src="'+location.pathname+'?preview=1"></iframe></div></div></div><div class="preview-footnote">'+w+' × '+h+' px · Prévia aproximada · Animações respeitam a preferência de movimento reduzido.</div></section>';const frame=$('device-preview-frame');frame.addEventListener('load',()=>{frame.contentWindow.postMessage({type:'IASD_THEME_PREVIEW',themeId:selectedSiteTheme},location.origin)})}
window.addEventListener('resize',()=>{if($('device-preview-frame'))drawDevicePreview()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('device-preview-frame'))closeDevicePreview()});

function newTab(){if(!canManageSite())return;const root=$('inline-editor-root');root.innerHTML='<div class="iasd-edit-backdrop" onclick="closeInlineTextEditor()"></div><section class="iasd-edit-dialog" role="dialog" aria-modal="true"><div class="iasd-edit-head"><strong>Criar aba</strong><button onclick="closeInlineTextEditor()">✕</button></div><p>A nova aba aparecerá no menu e no acesso rápido.</p><label>Nome</label><input id="new-tab-name" maxlength="70" placeholder="Ex.: Louvor"><label>Descrição</label><input id="new-tab-desc" maxlength="180"><label>Ícone</label><input id="new-tab-icon" maxlength="3" value="✦"><p id="new-tab-status"></p><button class="primary" onclick="createTab()">Criar aba</button></section>'}
async function createTab(){const title=$('new-tab-name')?.value.trim(),description=$('new-tab-desc')?.value.trim()||'',icon=$('new-tab-icon')?.value.trim()||'✦';if(!title){$('new-tab-status').textContent='Informe o nome.';return}const r=await cloud.from('iasd_custom_tabs').insert({title,description,icon,sort_order:100+customTabs.length}).select().single();if(r.error){$('new-tab-status').textContent=r.error.message;return}customTabs.push(r.data);closeInlineTextEditor();go('custom:'+r.data.id)}
function customPage(id){const t=customTabs.find(x=>x.id===id);if(!t)return '<div class="panel">Aba não encontrada.</div>';return '<div class="panel"><h2>'+esc(t.icon)+' '+esc(t.title)+'</h2><p>'+esc(t.description||'Página personalizada.')+'</p>'+(canManageSite()?'<button onclick="editCover('+JSON.stringify('custom_cover_'+id).replace(/"/g,'&quot;')+')">✎ Editar capa</button><button onclick="renameTab('+JSON.stringify(id).replace(/"/g,'&quot;')+')">Editar aba</button><button onclick="removeTab('+JSON.stringify(id).replace(/"/g,'&quot;')+')">Excluir aba</button>':'')+'</div>'}
async function renameTab(id){const t=customTabs.find(x=>x.id===id);if(!t||!canManageSite())return;const title=prompt('Nome da aba:',t.title);if(!title?.trim())return;const description=prompt('Descrição:',t.description||'');if(description===null)return;const r=await cloud.from('iasd_custom_tabs').update({title:title.trim(),description:description.trim()}).eq('id',id);if(r.error)alert(r.error.message);else loadCustomTabs()}
async function removeTab(id){if(!canManageSite()||!confirm('Excluir esta aba?'))return;const r=await cloud.from('iasd_custom_tabs').delete().eq('id',id);if(r.error)alert(r.error.message);else{customTabs=customTabs.filter(t=>t.id!==id);go('Painel')}}
function editCover(slot){if(!canManageSite())return;coverSlotEditing=slot;coverPath=siteAssets[slot]||'';const f=assetFrames[slot]||{};frameX=Number(f.position_x??50);frameY=Number(f.position_y??50);frameZoom=Number(f.zoom??1);drawCover();loadCoverGallery()}

function drawCover(){if(!coverSlotEditing)return;const slot=coverSlotEditing;const isBanner=slot==='home_banner'||slot.startsWith('home_banner_');const isQuick=!isBanner&&slot!=='site_logo';const media=coverPath?(isQuick?'<img class="quick-backdrop" src="'+esc(imageUrl(coverPath))+'" alt="" aria-hidden="true"><img id="cover-img" class="quick-foreground" src="'+esc(imageUrl(coverPath))+'" style="'+quickFrameStyle(frameX,frameY,frameZoom)+'" alt="Prévia">':'<img id="cover-img" src="'+esc(imageUrl(coverPath))+'" style="'+coverImageStyle(frameX,frameY,frameZoom)+'" alt="Prévia">'):'<span>Escolha ou importe uma imagem.</span>';$('inline-editor-root').innerHTML='<div class="iasd-edit-backdrop" onclick="closeCover()"></div><section class="cover-dialog" role="dialog" aria-modal="true"><header class="cover-head"><strong>✎ '+((slot==='home_banner'||slot.startsWith('home_banner_'))?'Imagem do carrossel da página inicial':slot==='site_logo'?'Logotipo':'Capa do acesso rápido')+'</strong><button onclick="closeCover()">✕</button></header><div class="cover-body"><div><div class="cover-preview '+((slot==='home_banner'||slot.startsWith('home_banner_'))?'wide':slot==='site_logo'?'logo':'portrait')+'">'+media+'</div><p>A imagem começa inteira (9:16). Ajuste o zoom e arraste para enquadrar, se desejar.</p><label>Zoom <input type="range" min="1" max="3" step=".05" value="'+frameZoom+'" oninput="coverFrame(\'z\',this.value)"></label><label>Horizontal <input type="range" min="0" max="100" value="'+frameX+'" oninput="coverFrame(\'x\',this.value)"></label><label>Vertical <input type="range" min="0" max="100" value="'+frameY+'" oninput="coverFrame(\'y\',this.value)"></label><button onclick="frameX=50;frameY=50;frameZoom=1;updateCover()">Centralizar</button></div><div><div class="cover-gallery-head"><h3>Galeria do site</h3><label>＋ Importar imagem<input type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden onchange="importCover(this)"></label></div><div id="cover-gallery" class="cover-gallery">Carregando...</div></div></div><footer class="cover-footer"><span id="cover-status"></span>'+((slot==='home_banner'||slot.startsWith('home_banner_'))?'<button onclick="editHomeCarousel()">‹ Voltar ao carrossel</button>':'')+'<button onclick="closeCover()">Cancelar</button>'+(siteAssets[slot]?'<button onclick="removeCover()">Remover imagem</button>':'')+'<button class="primary" onclick="saveCover()">Salvar e publicar</button></footer></section>';const el=$('inline-editor-root').querySelector('.cover-preview');let drag=false,x,y,fx,fy;el.onpointerdown=e=>{if(!coverPath)return;drag=true;x=e.clientX;y=e.clientY;fx=frameX;fy=frameY;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!drag)return;frameX=Math.max(0,Math.min(100,fx+(x-e.clientX)/el.clientWidth*100));frameY=Math.max(0,Math.min(100,fy+(y-e.clientY)/el.clientHeight*100));updateCover()};el.onpointerup=()=>drag=false;el.onpointercancel=()=>drag=false}
function updateCover(){const img=$('cover-img');if(img){img.style.cssText=(coverSlotEditing==='home_banner'||coverSlotEditing.startsWith('home_banner_')||coverSlotEditing==='site_logo')?coverImageStyle(frameX,frameY,frameZoom):quickFrameStyle(frameX,frameY,frameZoom)}const ranges=$('inline-editor-root').querySelectorAll('.cover-body input[type=range]');if(ranges.length===3){ranges[0].value=frameZoom;ranges[1].value=frameX;ranges[2].value=frameY}}
function coverFrame(k,v){if(k==='z')frameZoom=Number(v);if(k==='x')frameX=Number(v);if(k==='y')frameY=Number(v);updateCover()}
async function loadCoverGallery(){
 const slot=coverSlotEditing;if(!slot)return;
 const gallery=$('cover-gallery');if(!gallery)return;
 gallery.textContent='Carregando imagens da biblioteca...';
 try{
  // A biblioteca administrativa e o editor consultam os mesmos arquivos do Storage.
  // A RPC evita respostas vazias do endpoint de listagem do Storage.
  const result=await cloud.rpc('iasd_list_site_images');
  if(result.error)throw result.error;
  const all=(result.data||[]).map(x=>x.name).filter(Boolean);
  const el=$('cover-gallery');if(!el||coverSlotEditing!==slot)return;
  el.innerHTML=all.length?all.map(path=>'<button class="'+(coverPath===path?'selected':'')+'" onclick="chooseCover('+JSON.stringify(path).replace(/"/g,'&quot;')+')"><img loading="lazy" src="'+esc(imageUrl(path))+'" alt="'+esc(path)+'"></button>').join(''):'Nenhuma imagem encontrada na biblioteca do site.';
 }catch(e){
  const el=$('cover-gallery');if(el&&coverSlotEditing===slot)el.textContent='Não foi possível carregar a biblioteca: '+(e.message||String(e));
 }
}

async function saveCover(){if(!coverSlotEditing||!coverPath){$('cover-status').textContent='Escolha uma imagem.';return}const slot=coverSlotEditing;$('cover-status').textContent='Publicando...';const r=await cloud.from('iasd_site_assets').upsert({slot,image_path:coverPath,updated_at:new Date().toISOString()});if(r.error){$('cover-status').textContent=r.error.message;return}siteAssets[slot]=coverPath;const frame={slot,position_x:Math.round(frameX),position_y:Math.round(frameY),zoom:frameZoom};const q=await cloud.from('iasd_asset_framing').upsert(frame);if(q.error){$('cover-status').textContent=q.error.message;return}assetFrames[slot]=frame;closeCover();render()}
async function removeCover(){if(!coverSlotEditing||!confirm('Remover a imagem desta capa?'))return;const slot=coverSlotEditing,r=await cloud.from('iasd_site_assets').delete().eq('slot',slot);if(r.error){$('cover-status').textContent=r.error.message;return}delete siteAssets[slot];closeCover();render()}

 for(const item of targets){if(!item.el)continue;const {el,key,label}=item;if(!el.dataset.iasdDefault)el.dataset.iasdDefault=el.textContent.trim();if(Object.prototype.hasOwnProperty.call(siteTextOverrides,key))el.textContent=siteTextOverrides[key];if(!contentEditAllowed())continue;el.classList.add('iasd-editable-text');const btn=document.createElement('button');btn.className='iasd-pencil';btn.type='button';btn.textContent='✎';btn.title='Editar '+label;btn.setAttribute('aria-label','Editar '+label);btn.onclick=e=>{e.stopPropagation();e.preventDefault();openInlineTextEditor(key,label,el.dataset.iasdDefault,el.textContent.replace('✎','').trim())};el.appendChild(btn)}

// Preferência visual individual, independente do login.
function applyTheme(mode){
 const dark=mode==='dark';
 document.documentElement.setAttribute('data-theme',dark?'dark':'light');
 const btn=document.getElementById('theme-toggle');
 const icon=document.getElementById('theme-icon');
 const label=document.getElementById('theme-label');
 if(icon)icon.textContent=dark?'☀':'☾';
 if(label)label.textContent=dark?'Claro':'Escuro';
 if(btn){btn.setAttribute('aria-label',dark?'Ativar modo claro':'Ativar modo escuro');btn.title=dark?'Ativar modo claro':'Ativar modo escuro';btn.setAttribute('aria-pressed',String(dark))}
}
function toggleTheme(){
 const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
 try{localStorage.setItem('iasd-app-theme',next)}catch(e){}
 applyTheme(next);
}
try{applyTheme(localStorage.getItem('iasd-app-theme')==='light'?'light':'dark')}catch(e){applyTheme('dark')}

((d,i)=>'<button class="'+(layoutDevice===d?'selected':'')+'" onclick="selectLayoutDevice(\''+d+'\')">'+['▣ PC','▯ Tablet','▯ Celular'][i]+'</button>').join('')+'</div><div class="layout-frame-wrap"><div class="layout-frame-shell" style="width:'+(w*scale+12)+'px;height:'+(h*scale+12)+'px"><iframe id="layout-preview-frame" title="Prévia do layout" style="width:'+w+'px;height:'+h+'px;transform:scale('+scale+');transform-origin:top left" src="'+location.pathname+'?preview=1" onload="layoutPreviewSend()"></iframe></div></div></div></div><div class="layout-bottom"><span class="layout-status" id="layout-status">Selecione um template para visualizar.</span><button onclick="closeLayoutStudio()">Cancelar</button><button id="layout-publish" class="publish" onclick="publishLayout()">Publicar layout</button></div></section>';if(layoutFilter)filterLayouts(layoutFilter)}

async function pecGenerateAI(){const button=document.getElementById('pec-ai-button'),status=document.getElementById('pec-status');if(!cloudUser){alert('Entre na sua conta para gerar jograis com IA.');openAuthModal();return}const v=id=>document.getElementById('pec-'+id)?.value.trim()||'';const payload={tema:v('tema'),ocasiao:v('ocasiao'),pessoas:Number(v('pessoas')),duracao:v('duracao'),estilo:v('estilo'),referencia:v('referencia')};if(!payload.tema||payload.pessoas<2||payload.pessoas>30)return alert('Informe o tema e de 2 a 30 participantes.');button.disabled=true;button.textContent='✦ Criando seu jogral…';status.textContent='A IA está preparando as falas. Aguarde alguns segundos.';try{const session=await cloud.auth.getSession();if(!session.data.session?.access_token)throw Error('Entre novamente na sua conta.');const response=await fetch('/api/gerar-jogral',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.data.session.access_token},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok)throw Error(result.error||'Não foi possível gerar o roteiro.');document.getElementById('pec-text').value=result.text;status.textContent='Jogral criado! Revise as falas e confira as referências bíblicas antes do culto.'}catch(e){status.textContent='Erro: '+e.message}finally{button.disabled=false;button.textContent='✦ Gerar com IA grátis'}}

function pecSave(){const text=document.getElementById('pec-text')?.value||'';try{localStorage.setItem(PEC_KEY,JSON.stringify({text,updatedAt:new Date().toISOString()}));document.getElementById('pec-status').textContent='Roteiro salvo neste dispositivo.'}catch(e){document.getElementById('pec-status').textContent='Não foi possível salvar: '+e.message}}

let iasdBible1911=null;
async function iasdGetBible1911(book,chapter){
 if(!iasdBible1911)iasdBible1911=fetch('https://cdn.jsdelivr.net/gh/BibliaJFAAL/JFAAL@main/original/1911-JFAAtualizada.json').then(r=>{if(!r.ok)throw Error('Fonte indisponível');return r.json()}).catch(e=>{iasdBible1911=null;throw e});
 const data=await iasdBible1911,books=Array.isArray(data)?data:(data.books||data.livros||data.data);

 if(!Array.isArray(books)||books.length!==66||index<0)throw Error('Fonte incompleta');
 const item=books[index],chapters=item.chapters||item.capitulos||item.content;
 const chapterData=chapters?.[chapter-1],raw=Array.isArray(chapterData)?chapterData:(chapterData?.verses||chapterData?.versiculos);
 if(!Array.isArray(raw))throw Error('Capítulo indisponível');
 const verses=raw.map((v,i)=>({verse:Number(v?.number||v?.numero||i+1),text:typeof v==='string'?v:String(v?.text||v?.texto||'')})).filter(v=>v.text.trim());
 if(!verses.length||verses[0].verse!==1)throw Error('Capítulo incompleto');

}
async function fetchBibleChapter(book,chapter,requestedTranslation){
 const translation=requestedTranslation||$('btranslation')?.value||readerState.translation||'almeida';const key=book+'|'+chapter+'|'+translation;
 if(bibleChapterCache.has(key))return bibleChapterCache.get(key);
 const url='https://bible-api.com/'+encodeURIComponent(book+' '+chapter)+'?translation='+encodeURIComponent(translation)+'&single_chapter_book_matching=indifferent';
 const promise=(async()=>{
  if(translation==='almeida'){try{return await iasdGetBible1911(book,Number(chapter))}catch(e){console.warn('Almeida 1911 indisponível:',e)}}
  const response=await fetch(url);
  if(!response.ok)throw Error('Consulta indisponível ('+response.status+')');
  const result=await response.json();
  if(!Array.isArray(result.verses)||!result.verses.length)throw Error('Capítulo não encontrado');
  const verses=result.verses.filter(v=>Number(v.chapter)===Number(chapter)&&Number.isInteger(Number(v.verse))&&typeof v.text==='string').sort((a,b)=>a.verse-b.verse);
  if(!verses.length)throw Error('Capítulo não encontrado na tradução');
  // A consulta de versículos individuais permite recuperar eventuais lacunas da resposta do capítulo.
  const byNumber=new Map(verses.map(v=>[Number(v.verse),v]));
  const highest=Math.max(...byNumber.keys()),missing=Array.from({length:highest},(_,i)=>i+1).filter(n=>!byNumber.has(n));
  if(missing.length&&missing.length<=15){
   await Promise.all(missing.map(async n=>{
    try{const url='https://bible-api.com/'+encodeURIComponent(book+' '+chapter+':'+n)+'?translation='+encodeURIComponent(translation);
     const response=await fetch(url);if(!response.ok)return;
     const item=await response.json();const verse=item.verses?.find(v=>Number(v.chapter)===chapter&&Number(v.verse)===n&&typeof v.text==='string');
     if(verse)byNumber.set(n,verse);
    }catch(e){}
   }));
  }
  return [...byNumber.values()].sort((a,b)=>a.verse-b.verse);
 })();
 bibleChapterCache.set(key,promise);
 try{return await promise}catch(e){bibleChapterCache.delete(key);throw e}
}

async function readBibleChapter(){const book=$('bbook'),chapter=Number($('bchapter').value||$('bchapterSelect').value),out=$('bresult');if(!Number.isInteger(chapter)||chapter<1||chapter>(bibleChapterCounts[book.selectedIndex]||150)){out.textContent='Selecione um capítulo válido.';return}const ref=book.options[book.selectedIndex].text+' '+chapter;out.textContent='Carregando '+ref+'…';try{const verses=await fetchBibleChapter(book.value,chapter);const section=document.createElement('section');section.className='bible-result';const heading=document.createElement('h3');heading.textContent=ref;section.append(heading);for(const verse of verses){const p=document.createElement('p');p.style.cssText='line-height:1.85;margin:0 0 10px';const n=document.createElement('strong');n.textContent=verse.verse+' ';p.append(n,document.createTextNode(verse.text.trim()));section.append(p)}out.replaceChildren(section)}catch(e){out.textContent='Não foi possível carregar '+ref+': '+(e.message||'Verifique a conexão.')}}
async function searchBible(){
 const book=$('bbook'),chapter=Number($('bchapter').value||$('bchapterSelect').value),v=($('bverse').value||$('bverseSelect').value).trim(),out=$('bresult');
 if(!Number.isInteger(chapter)||chapter<1||chapter>(bibleChapterCounts[book.selectedIndex]||150)||!/^\d{1,3}(?:-\d{1,3})?$/.test(v)){out.textContent='Informe um capítulo e versículo válidos.';return}

 if(start<1||(end!==undefined&&(end<start||end-start>30))){out.textContent='Escolha um intervalo de até 31 versículos.';return}

 try{
  const verses=await fetchBibleChapter(book.value,chapter);
  const chosen=verses.filter(x=>x.verse>=start&&x.verse<=(end||start));
  if(chosen.length!==(end||start)-start+1||chosen.some((item,i)=>item.verse!==start+i))throw Error('Há versículos ausentes na resposta da fonte bíblica. Não serão exibidos textos incompletos. Tente novamente ou consulte outra edição licenciada.');

 }catch(e){bibleResult=null;out.innerHTML='<div class="bible-error">Não foi possível carregar '+esc(ref)+'. '+esc(e.message||'Verifique sua conexão e tente novamente.')+' <button onclick="searchBible()">Tentar novamente</button></div>'}
