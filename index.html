const bibleBooks=[["Gênesis","genesis"],["Êxodo","exodus"],["Levítico","leviticus"],["Números","numbers"],["Deuteronômio","deuteronomy"],["Josué","joshua"],["Juízes","judges"],["Rute","ruth"],["1 Samuel","1 samuel"],["2 Samuel","2 samuel"],["1 Reis","1 kings"],["2 Reis","2 kings"],["1 Crônicas","1 chronicles"],["2 Crônicas","2 chronicles"],["Esdras","ezra"],["Neemias","nehemiah"],["Ester","esther"],["Jó","job"],["Salmos","psalms"],["Provérbios","proverbs"],["Eclesiastes","ecclesiastes"],["Cânticos","song of solomon"],["Isaías","isaiah"],["Jeremias","jeremiah"],["Lamentações","lamentations"],["Ezequiel","ezekiel"],["Daniel","daniel"],["Oseias","hosea"],["Joel","joel"],["Amós","amos"],["Obadias","obadiah"],["Jonas","jonah"],["Miqueias","micah"],["Naum","nahum"],["Habacuque","habakkuk"],["Sofonias","zephaniah"],["Ageu","haggai"],["Zacarias","zechariah"],["Malaquias","malachi"],["Mateus","matthew"],["Marcos","mark"],["Lucas","luke"],["João","john"],["Atos","acts"],["Romanos","romans"],["1 Coríntios","1 corinthians"],["2 Coríntios","2 corinthians"],["Gálatas","galatians"],["Efésios","ephesians"],["Filipenses","philippians"],["Colossenses","colossians"],["1 Tessalonicenses","1 thessalonians"],["2 Tessalonicenses","2 thessalonians"],["1 Timóteo","1 timothy"],["2 Timóteo","2 timothy"],["Tito","titus"],["Filemom","philemon"],["Hebreus","hebrews"],["Tiago","james"],["1 Pedro","1 peter"],["2 Pedro","2 peter"],["1 João","1 john"],["2 João","2 john"],["3 João","3 john"],["Judas","jude"],["Apocalipse","revelation"]];let bibleResult=null;function bibleUI(){return '<div class="panel"><h2>Pesquisar na Bíblia</h2><p class="muted">Selecione ou digite o capítulo e o versículo. Tradução: Almeida em português.</p><label for="bbook">Livro</label><select id="bbook" style="width:100%;background:#0a1421;border:1px solid #394658;border-radius:12px;padding:13px;color:white;margin:8px 0 14px" onchange="updateBibleChapters()">'+bibleBooks.map(([pt,en])=>'<option value="'+en+'" '+(en==='john'?'selected':'')+'>'+pt+'</option>').join('')+'</select><div class="grid"><div><label for="bchapter">Capítulo</label><select id="bchapterSelect" aria-label="Selecionar capítulo" onchange="syncBibleChapter(this.value)" style="width:100%;background:#0a1421;border:1px solid #394658;border-radius:12px;padding:13px;color:white;margin:8px 0"></select><input type="number" min="1" max="150" id="bchapter" value="" aria-label="Digitar capítulo" placeholder="Ou digite" oninput="syncBibleChapterSelect(this.value)"></div><div><label for="bverse">Versículo</label><select id="bverseSelect" aria-label="Selecionar versículo" onchange="syncBibleVerse(this.value)" style="width:100%;background:#0a1421;border:1px solid #394658;border-radius:12px;padding:13px;color:white;margin:8px 0"></select><input id="bverse" placeholder="Ou digite: 16 ou 16-18" value="" aria-label="Digitar versículo ou intervalo" oninput="syncBibleVerseSelect(this.value)"></div></div><button class="primary" onclick="searchBible()">⌕ Buscar versículo</button><div id="bresult" aria-live="polite" style="margin-top:16px"></div><p class="muted" style="font-size:12px">Seletores e digitação ficam sincronizados. A consulta exige internet.</p></div>'}const bibleChapterCounts=[50,40,27,36,34,24,21,4,31,24,22,25,29,36,10,13,10,42,150,31,12,8,66,52,5,48,12,14,3,9,1,4,7,3,3,3,2,14,4,28,16,24,21,28,16,16,13,6,6,4,4,5,3,6,4,3,1,13,5,5,3,5,1,1,1,22];function updateBibleChapters(){const index=$('bbook').selectedIndex,max=bibleChapterCounts[index]||150;const sel=$('bchapterSelect');sel.innerHTML='<option value="">Selecione</option>'+Array.from({length:max},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'</option>').join('');$('bchapter').max=max;$('bchapter').value='';sel.value='';$('bverse').value='';updateBibleVerses()}function syncBibleChapter(value){$('bchapter').value=value;$('bchapterSelect').value=value;updateBibleVerses()}function syncBibleChapterSelect(value){const n=Number(value);if(Number.isInteger(n)&&n>=1&&n<=Number($('bchapter').max)){$('bchapterSelect').value=String(n);updateBibleVerses()}}function syncBibleVerse(value){$('bverse').value=value;const out=$('bresult');if(out)out.innerHTML=''}function syncBibleVerseSelect(value){if(/^\d+$/.test(value)&&Number(value)>0&&Array.from($('bverseSelect').options).some(o=>o.value===value))$('bverseSelect').value=value;else $('bverseSelect').value=''}async function updateBibleVerses(){const sel=$('bverseSelect');if(!sel)return;const book=$('bbook').value,chapter=$('bchapter').value;const old=$('bverse').value;if(!chapter){sel.innerHTML='<option value="">Selecione o capítulo</option>';$('bverse').value='';return}sel.innerHTML='<option value="">Carregando...</option>';try{const r=await fetch('https://bible-api.com/'+encodeURIComponent(book+' '+chapter)+'?translation=almeida');if(!r.ok)throw Error();const json=await r.json();if(book!==$('bbook').value||chapter!==$('bchapter').value)return;const count=json.verses?.length||0;if(!count)throw Error();sel.innerHTML='<option value="">Selecione</option>'+Array.from({length:count},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'</option>').join('');if(/^\d+$/.test(old)&&Number(old)>=1&&Number(old)<=count)sel.value=old;else if(!old){sel.value='';$('bverse').value=''}}catch{sel.innerHTML='<option value="">Digite o versículo</option>'}}async function searchBible(){const book=$('bbook'),chapter=Number($('bchapter').value||$('bchapterSelect').value),v=($('bverse').value||$('bverseSelect').value).trim(),out=$('bresult');if(!Number.isInteger(chapter)||chapter<1||chapter>(bibleChapterCounts[book.selectedIndex]||150)||!/^\d{1,3}(?:-\d{1,3})?$/.test(v)){out.textContent='Informe capítulo e versículo válidos.';return}const [start,end]=v.split('-').map(Number);if(start<1||(end!==undefined&&(end<start||end-start>30))){out.textContent='Escolha um intervalo de até 31 versículos.';return}const ref=book.options[book.selectedIndex].text+' '+chapter+':'+v;out.textContent='Buscando '+ref+'...';try{const response=await fetch('https://bible function drawNames(){const names=$('names').value.split('\n').map(x=>x.trim()).filter(Boolean);const pool=$('unique').checked?names.filter(n=>!data.sorteados.includes(n)):names;if(!pool.length){$('drawresult').textContent='Sem nomes disponíveis';return}const name=pool[Math.floor(Math.random()*pool.length)];data.sorteados.push(name);project(name);render();$('names').value=names.join('\n');$('drawresult').textContent='Sorteado: '+name}function drawNumber(){const a=Number($('min').value),b=Number($('max').value);if(!Number.isInteger(a)||!Number.isInteger(b)||b<a){alert('Intervalo inválido');return}const n=a+Math.floor(Math.random()*(b-a+1));$('numresult').textContent='Número: '+n;project(String(n))}let mediaURL;function loadMedia(input){if(mediaURL)URL.revokeObjectURL(mediaURL);const file=input.files[0];if(!file)return;mediaURL=URL.createObjectURL(file);const el=file.type.startsWith('video/')?'video':file.type.startsWith('audio/')?'audio':'img';$('player').innerHTML='<'+el+' src="'+mediaURL+'" controls style="max-width:100%;max-height:60vh" '+(el==='img'?'alt="Prévia"':'')+'></'+el+'>'}render();initCloud();</script></body></html>
