<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IASD Studio</title><style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f6f5f4;background:#080f18;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 75% -10%,#1e3047 0%,transparent 45%),#080f18}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;color:inherit}header{padding:24px 20px 15px;display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:auto}header h1{font-size:24px;letter-spacing:.045em;font-weight:750;color:#f4f6fb;margin:0}header h1 span{color:#eac174}header small{font-size:10px;letter-spacing:.22em;color:#a6aeba}.brand{display:flex;align-items:center;gap:12px}.brandmark{font-size:31px;color:#e7b957}main{max-width:1100px;margin:auto;padding:0 16px 110px}.iconbtn{border:1px solid #354050;border-radius:14px;background:#192331;padding:12px}.hero{border-radius:20px;padding:26px 20px;margin:4px 0 16px;min-height:180px;background:linear-gradient(90deg,#0b1420 4%,rgba(11,20,32,.88) 50%,rgba(11,20,32,.35)),radial-gradient(ellipse at 80% 40%,#365579,#0b1420 65%);display:flex;flex-direction:column;justify-content:center}.hero h2{font-size:28px;margin:0 0 8px}.hero p{color:#c1c6d0;font-size:16px;line-height:1.5;max-width:260px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile,.panel{border:1px solid #283342;background:linear-gradient(145deg,#131f2c,#101924);border-radius:19px;box-shadow:0 6px 22px #0002}.tile{display:flex;align-items:center;text-align:left;gap:12px;min-height:112px;padding:16px 13px;width:100%}.tile strong{font-size:13px;letter-spacing:.02em;display:block}.tile small{font-size:12px;color:#aab4c4;display:block;line-height:1.5;margin-top:5px}.tile .glyph{font-size:26px;flex:0 0 44px;height:50px;border-radius:14px;background:#20314a;display:grid;place-items:center}.tile.feature{min-height:118px;border-color:#7d6238;background:linear-gradient(130deg,#3a2c1b,#151c23)}.tile.feature .glyph{background:#624823;color:#ffd88a;border:1px solid #d2a65d}.tile:active{transform:scale(.98)}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:26px 3px 12px}.sectionhead h2{font-size:18px;margin:0}.panel{padding:18px;margin:16px 0}.panel h2{font-size:20px;margin:0 0 16px}.panel h3{font-size:15px}.panel p,.muted{color:#b8c0cc}.panel input,.panel textarea{width:100%;background:#0a1421;border:1px solid #394658;border-radius:12px;padding:13px;color:#fff;margin:7px 0 12px;outline:none}.panel input[type=checkbox]{width:auto}.panel button,.action{background:#263b54;padding:12px 16px;border-radius:12px;font-weight:650;margin:4px 4px 4px 0}.panel button.primary,.action.primary{background:#d2a451;color:#14110c}.actions{display:flex;gap:6px;flex-wrap:wrap}ul{list-style:none;padding:0}li{padding:12px 0;border-bottom:1px solid #29384a;overflow-wrap:anywhere}li button{font-size:12px}#stage{min-height:130px;background:#05090e;border-radius:15px;display:grid;place-items:center;padding:16px;text-align:center;white-space:pre-wrap;font-size:24px;color:#fff}.schedule{display:grid;grid-template-columns:65px 1fr;gap:8px;padding:12px;border-radius:10px;background:#1b2a3a;margin:6px 0}.schedule b{color:#e9ba68}.bottomnav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;padding:12px 8px calc(12px + env(safe-area-inset-bottom));background:#111b28ee;backdrop-filter:blur(18px);border-top:1px solid #2d3949}.bottomnav button{background:none;display:flex;align-items:center;flex-direction:column;gap:5px;font-size:10px;color:#aeb9c8;min-width:48px}.bottomnav button span{font-size:22px}.bottomnav button.active{color:#edbd67}.bottomnav .projectnav{transform:translateY(-15px)}.bottomnav .projectnav span{border-radius:50%;width:58px;height:58px;display:grid;place-items:center;background:#3a2e1e;border:2px solid #e9b964;color:#ffd27b;box-shadow:0 0 24px #e9b96430}.hidden{display:none}@media(min-width:780px){main{padding-bottom:50px}.bottomnav{max-width:680px;left:50%;transform:translateX(-50%);border-radius:22px 22px 0 0}.hero{min-height:220px}.tile strong{font-size:16px}.tile small{font-size:14px}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><div class="brand"><span class="brandmark">✦</span><div><h1>IASD <span>STUDIO</span></h1><small>SONOPLASTIA E PROJEÇÃO</small></div></div><button class="iconbtn" onclick="current='Mais';render()" aria-label="Configurações">⚙</button></header><main><section id="content"></section></main><nav class="bottomnav" id="tabs" aria-label="Navegação principal"></nav><script>
const tabs=['Painel','Cronograma','Escalas','Sorteadores','Mídia','Bíblia','Datas especiais'];let current='Painel';const initial={cronograma:[],escalas:[],datas:[],sorteados:[],stage:'IASD STUDIO',media:[]};let data;try{data={...initial,...JSON.parse(localStorage.getItem('iasd-studio')||'{}')}}catch{data={...initial}}const save=()=>{localStorage.setItem('iasd-studio',JSON.stringify(data));render()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=id=>document.getElementById(id);function project(t){data.stage=t;localStorage.setItem('iasd-studio',JSON.stringify(data));localStorage.setItem('iasd-stage',t);$('stage')&&($('stage').textContent=t);try{channel.postMessage(t)}catch{}}const channel=new BroadcastChannel('iasd-stage');function openProjection(){const w=window.open('','iasd-projection');if(!w){alert('Permita janelas pop-up para abrir o projetor');return}w.document.write('<!doctype html><html><meta charset="utf-8"><title>Projeção IASD</title><style>body{margin:0;background:#000;color:#fff;display:grid;place-items:center;height:100vh;font:clamp(30px,5vw,90px) system-ui;text-align:center;white-space:pre-wrap;padding:4vw;box-sizing:border-box}</style><main id="out"></main><script>document.getElementById("out").textContent=localStorage.getItem("iasd-stage")||"IASD STUDIO";const ch=new BroadcastChannel("iasd-stage");ch.onmessage=e=>document.getElementById("out").textContent=e.data;window.addEventListener("storage",e=>{if(e.key==="iasd-stage")document.getElementById("out").textContent=e.newValue});<\/script></html>');w.document.close()}function itemList(key){return '<ul>'+data[key].map((x,i)=>'<li>'+esc(x)+' <button onclick="removeItem(\''+key+'\','+i+')">Excluir</button> <button onclick="project('+JSON.stringify(x).replace(/"/g,'&quot;')+')">Projetar</button></li>').join('')+'</ul>'}function removeItem(key,i){data[key].splice(i,1);save()}function addItem(key){const el=$('new-'+key);if(el.value.trim()){data[key].push(el.value.trim());save()}}function section(key,title,placeholder){return '<div class="panel"><h2>'+title+'</h2><input id="new-'+key+'" placeholder="'+placeholder+'"><button onclick="addItem(\''+key+'\')">Adicionar</button>'+itemList(key)+'</div>'}function go(t){current=t;render();window.scrollTo({top:0,behavior:'smooth'})}function tile(t,sub,glyph,color,featured){return '<button class="tile '+(featured?'feature':'')+'" onclick="go(\''+t+'\')"><span class="glyph" style="color:'+color+'">'+glyph+'</span><span><strong>'+t.toUpperCase()+'</strong><small>'+sub+'</small></span></button>'}function render(){
const nav=[['Painel','⌂','Início'],['Cronograma','▦','Agenda'],['Mídia','▱','Biblioteca'],['Projeção','▶','Projetor'],['Bíblia','▤','Bíblia'],['Mais','☰','Mais']];
$('tabs').innerHTML=nav.map(([t,i,n])=>'<button class="'+(current===t?'active ':'')+(t==='Projeção'?'projectnav':'')+'" onclick="go(\''+t+'\')"><span>'+i+'</span>'+n+'</button>').join('');
let out='';
if(current==='Painel')out='<div class="hero"><h2>Bem-vindo</h2><p>Organize, controle e apresente com excelência.</p></div><div class="grid">'+tile('Projeção','Abrir painel do projetor','▶','#ffce77',true)+'<button class="tile" onclick="openProjection()"><span class="glyph">▣</span><span><strong>SEGUNDA TELA</strong><small>Abrir projetor ↗</small></span></button>'+tile('Cronograma','Programação do dia','▦','#6fa6ff')+tile('Escalas','Do dia e do mês','♟','#b194ff')+tile('Sorteadores','Provai e Vede, números e pessoas','⤨','#73e0a5')+tile('Mídia','Músicas, vídeos e informativos','♫','#ff8297')+tile('Bíblia','Versículos para projeção','▤','#f7c975')+tile('Datas especiais','Eventos e celebrações','✧','#cda1ff')+'</div><div class="panel"><div class="sectionhead"><h2>Culto de hoje</h2><button onclick="go(\'Cronograma\')">Ver completo ›</button></div>'+(data.cronograma.length?data.cronograma.map(x=>'<div class="schedule"><span>✦</span><span>'+esc(x)+'</span></div>').join(''):'<p>Seu cronograma aparecerá aqui. Adicione a programação na aba Agenda.</p>')+'</div>';
if(current==='Projeção')out='<div class="sectionhead"><h2>Controle de projeção</h2></div><div class="panel"><h2>Prévia da tela</h2><div id="stage">'+esc(data.stage)+'</div><textarea id="custom" rows="4" placeholder="Digite o texto para projetar"></textarea><div class="actions"><button class="primary" onclick="project($(\'custom\').value)">▶ Projetar</button><button onclick="project(\'\')">Tela preta</button><button onclick="openProjection()">▣ Segunda tela</button></div><p class="muted">A segunda tela funciona no mesmo navegador. O controle entre dispositivos será adicionado em outra etapa.</p></div>';
if(current==='Cronograma')out=section('cronograma','Cronograma do culto','Horário — atividade — responsável');
if(current==='Escalas')out=section('escalas','Escalados do dia e do mês','Data — nome — função');
if(current==='Datas especiais')out=section('datas','Datas especiais','Data — evento');
if(current==='Sorteadores')out='<div class="panel"><h2>Provai e Vede / Culto do lar</h2><textarea id="names" rows="6" placeholder="Um nome por linha"></textarea><label><input type="checkbox" id="unique" checked> Evitar repetição nesta sessão</label><div class="actions"><button class="primary" onclick="drawNames()">Sortear pessoa</button><button onclick="data.sorteados=[];save()">Reiniciar histórico</button></div><p id="drawresult"></p><h3>Histórico</h3><p>'+esc(data.sorteados.join(', '))+'</p></div><div class="panel"><h2>Sorteio de números</h2><label>De <input type="number" id="min" value="1"></label><label>Até <input type="number" id="max" value="100"></label><button class="primary" onclick="drawNumber()">Sortear número</button><p id="numresult"></p></div>';
if(current==='Mídia')out='<div class="panel"><h2>Biblioteca de mídia</h2><p>Reproduza músicas, vídeos e imagens do seu dispositivo.</p><input type="file" id="mediafile" accept="audio/*,video/*,image/*" onchange="loadMedia(this)"><div id="player"></div><p class="muted">Os arquivos não são enviados nem salvos no servidor. Utilize somente conteúdo autorizado.</p></div>';
if(current==='Bíblia')out='<div class="panel"><h2>Projeção bíblica</h2><p>Insira a referência e o texto do versículo.</p><input id="ref" placeholder="Livro capítulo:versículo"><textarea id="verse" rows="6" placeholder="Texto do versículo"></textarea><button class="primary" onclick="project($(\'ref\').value+\'\\n\'+$(\'verse\').value)">Projetar versículo</button></div>';
if(current==='Mais')out='<div class="sectionhead"><h2>Mais ferramentas</h2></div><div class="grid">'+tile('Escalas','Equipe e responsáveis','♟','#b194ff')+tile('Sorteadores','Provai e Vede e números','⤨','#73e0a5')+tile('Datas especiais','Datas da igreja','✧','#cda1ff')+'</div><div class="panel"><h2>IASD Studio</h2><p>As informações são salvas neste navegador. Não coloque dados pessoais sensíveis em dispositivos compartilhados.</p><button onclick="openProjection()">Abrir projetor</button></div>';
$('content').innerHTML=out;
}function drawNames(){const names=$('names').value.split('\n').map(x=>x.trim()).filter(Boolean);const pool=$('unique').checked?names.filter(n=>!data.sorteados.includes(n)):names;if(!pool.length){$('drawresult').textContent='Sem nomes disponíveis';return}const name=pool[Math.floor(Math.random()*pool.length)];data.sorteados.push(name);project(name);render();$('names').value=names.join('\n');$('drawresult').textContent='Sorteado: '+name}function drawNumber(){const a=Number($('min').value),b=Number($('max').value);if(!Number.isInteger(a)||!Number.isInteger(b)||b<a){alert('Intervalo inválido');return}const n=a+Math.floor(Math.random()*(b-a+1));$('numresult').textContent='Número: '+n;project(String(n))}let mediaURL;function loadMedia(input){if(mediaURL)URL.revokeObjectURL(mediaURL);const file=input.files[0];if(!file)return;mediaURL=URL.createObjectURL(file);const el=file.type.startsWith('video/')?'video':file.type.startsWith('audio/')?'audio':'img';$('player').innerHTML='<'+el+' src="'+mediaURL+'" controls style="max-width:100%;max-height:60vh" '+(el==='img'?'alt="Prévia"':'')+'></'+el+'>'}render();</script></body></html>
